<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AstroChat · Add Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="screen" id="screen">
      <!-- header -->
      <header class="nav">
        <div class="topnav">
          <button class="ttl" type="button" aria-label="Back"><span class="back"><img src="assets/back.svg" width="18" height="18" alt=""></span><h1>Add Money</h1></button>
          <span class="badge"><img src="assets/wallet.svg" width="20" height="20" alt=""><p>₹0</p></span>
        </div>
      </header>

      <!-- collapsed: band + receipt with 3 amounts -->
      <section class="collapsed" id="collapsed">
        <div class="banner" id="band"></div>
        <div class="rcpt" id="rcpt"><svg class="rcptline" id="rcptLine" aria-hidden="true"><path id="rcptPath"/></svg><span class="notch l"></span><span class="notch r"></span></div>
        <div class="stack">
          <div class="skus" id="skus"></div>
          <div class="see"><button class="seebtn" type="button" id="seeMore" aria-expanded="false"><p>See More Options</p><img class="chev" src="assets/chevron.svg" alt=""></button></div>
        </div>
      </section>

      <!-- open: scrollable list of all amounts -->
      <section class="openwrap" id="openwrap" aria-hidden="true">
        <div class="openscroll" id="openscroll">
          <div class="openblk">
            <div class="band3" id="band3"></div>
            <div class="rc">
              <span class="notch l"></span><span class="notch r"></span>
              <div class="grid" id="grid"></div>
              <div class="seerow"><button class="seebtn" type="button" id="seeLess"><p>See Less Options</p><img class="chev up" src="assets/chevron.svg" alt=""></button></div>
            </div>
          </div>
          <div class="scrollpad" id="scrollpad"></div>
        </div>
        <span class="sbar" id="sbar"><i id="sthumb"></i></span>
      </section>

      <!-- sticky bottom: card + arc mounted on the payment summary -->
      <section class="payblock" id="payblock">
        <div class="cardwrap">
          <span class="veilfade" id="veil"></span>
          <div class="ac green" id="card">
            <span class="skin"><span class="spin"></span></span>
            <div class="c"><p class="e" id="cardE">CONGRATULATIONS!</p>
              <p class="amt"><span class="r">₹</span><span class="n" id="cardN">110</span></p>
              <p class="t">will be added to your wallet</p></div>
          </div>
          <svg class="arc" viewBox="0 0 360 24" preserveAspectRatio="none" aria-hidden="true">
            <defs><linearGradient id="arcG" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fff"/><stop offset=".48" stop-color="#78F8BE"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
            <path d="M0 1.5C120 28 240 28 360 1.5V24H0Z" fill="#fff"/>
            <path id="arcLine" d="M0 1.5C120 28 240 28 360 1.5" stroke="url(#arcG)" stroke-width="3" fill="none"/>
          </svg>
        </div>

        <div class="summary" id="summary">
          <button class="sumrow" type="button" id="sumToggle" aria-expanded="false">
            <span class="sl">Payment Summary</span>
            <span class="sr"><span id="sumTxt">₹100 + ₹18 GST</span><img class="chev" id="sumChev" src="assets/chevron.svg" alt=""></span>
          </button>
          <div class="ps-details"><div class="ps-inner" id="psInner"></div></div>
        </div>

        <div class="cta">
          <button class="payw" type="button" id="payWith"><span class="l">Pay with <img class="chev" src="assets/chevron.svg" alt=""></span><span class="pp" id="pp"></span></button>
          <button class="paybtn" type="button" id="payBtn"><b>Pay ₹118</b><small> (GST incl.)</small></button>
        </div>
      </section>

      <!-- payment method sheet (original design) -->
      <div class="pm-overlay" id="pmOverlay" aria-hidden="true">
        <div class="pm-scrim" data-pmclose></div>
        <div class="pm-sheet" role="dialog" aria-label="Select Payment Method">
          <div class="pm-head"><p>Select Payment Method</p><button class="pm-x" type="button" data-pmclose aria-label="Close"><img src="assets/close.svg" alt=""></button></div>
          <div class="pm-body" id="pmBody"></div>
        </div>
        <div class="pm-cta">
          <p class="pm-credit" id="pmCredit"></p>
          <div class="pm-btnwrap"><button class="paybtn pm-pay" type="button" id="pmPay"></button></div>
        </div>
      </div>
    </div>
  </main>
<script src="app.js"></script>
</body>
</html>
