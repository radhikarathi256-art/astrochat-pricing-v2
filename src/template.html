/* ---------- ADD MONEY: behaviour ----------
   Ported from pricing-v2's app.js. That file bound everything once at load because its DOM
   was static; here mount() rebuilds the screen, so every binding is re-made in initAM() and
   all lookups are scoped to amRoot rather than document. Selection lives in v1's `ab` so the
   flows (wallet / listingChat / again / post3 / continue) still drive this screen. */
let amRoot=null;
const A = id => amRoot.querySelector('#'+id);
const gstFor = v => Math.round(v*0.18);
const isGold = () => bonusFor(ab.sel)===0;   // ₹50 earns nothing, so the band turns gold

const CORNER = `<span class="corner"><svg width="38" height="38" viewBox="0 0 38 38"><path d="M0 0H38V38Z" fill="#EF6939"/><path class="tick" d="M30.2 11.1L24.3 16.2L21.4 13.5L21.9 12.8L24.3 14.9L29.7 10.3L30.2 11.1Z" fill="#fff"/></svg></span>`;

/* tiles — the badge sweep replays on every rebuild, so its phase rides a negative delay */
const coinClock = performance.now();
const SWEEP_CYCLE = 3.2;
const sweepDelay = i => (-(((performance.now()-coinClock)/1000 + i*.38) % SWEEP_CYCLE)).toFixed(2);
// Takes the BASE row but deliberately ignores its bonus column: the badge must show what the
// wallet will ACTUALLY be credited, which under ASTRO50 is the base bonus plus the flat ₹50.
function amTile([v], i){
  const on = v===ab.sel, b = bonusFor(v);
  return `<div class="col">
    <div class="opt" role="radio" tabindex="0" aria-checked="${on}" aria-label="₹${fmt(v)}${b?`, ₹${fmt(b)} extra`:''}" data-amt="${v}">
      <div class="box ${on?'on':''}"><div class="sku"><span class="r">₹</span><span class="n">${v}</span></div>${on?CORNER:''}</div>
    </div>
    ${b?`<div class="chip" style="--sd:${sweepDelay(i)}s"><p>+₹<b>${fmt(b)}</b> more</p></div>`:''}
  </div>`;
}
// Collapsed row: ₹50 · ₹100 · ₹250, or the picked amount in the third slot when it's bigger.
function collapsedSet(){
  const base=BASE.slice(0,3);
  if(ab.sel<=250) return base;
  return [BASE[1],BASE[2],BASE.find(a=>a[0]===ab.sel)];
}
function renderTiles(){
  A('skus').innerHTML = collapsedSet().map(amTile).join('');
  A('grid').innerHTML = BASE.map(amTile).join('');
  mountCoins();
}

/* Coin shower on the hero amount — a dotLottie drawn onto ONE canvas.
   renderTiles() rebuilds both tile containers from scratch on every tap, so the player is
   created once and its canvas is RE-PARENTED into whichever tile currently needs it. Building a
   new DotLottie per render would restart the loop and re-init its renderer on each tap. */
const COIN_LOTTIE = 'https://lottie.host/d4101c1e-c028-466c-8475-e9788ec23564/sUf0MvXJiL.lottie';
let coinWrap=null, coinCanvas=null, coinPlayer=null, coinTried=false;

function initCoins(){
  if(RM || coinTried) return;
  coinTried = true;
  coinWrap = document.createElement('span');
  coinWrap.className = 'coinfall';
  coinWrap.setAttribute('aria-hidden','true');
  coinCanvas = document.createElement('canvas');
  coinWrap.appendChild(coinCanvas);
  mountCoins();
  // CDN import: there is no bundler here. If it fails (offline/blocked) the tile simply shows
  // no coins rather than breaking the page.
  import('https://esm.sh/@lottiefiles/dotlottie-web@0.40.2').then(({DotLottie})=>{
    coinPlayer = new DotLottie({canvas:coinCanvas, src:COIN_LOTTIE, autoplay:true, loop:true,
      layout:{fit:'cover', align:[.5,.5]}});
    sizeCoins();
  }).catch(()=>{});
}
// The canvas backing store has to track its CSS box or the coins render soft.
function sizeCoins(){
  if(!coinWrap || !coinCanvas) return;
  const r = coinWrap.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const dpr = Math.min(devicePixelRatio||1, 2);
  const w = Math.round(r.width*dpr), h = Math.round(r.height*dpr);
  if(coinCanvas.width===w && coinCanvas.height===h) return;
  coinCanvas.width=w; coinCanvas.height=h;
  coinPlayer?.resize();
}
// Moves the one canvas into the visible container's hero tile. Paused while that tile is the
// selected one, since .box.on hides the layer there anyway.
function mountCoins(){
  if(!coinWrap || !amRoot) return;
  const amt = ab.coin||250;
  const root = ab.open ? A('grid') : A('skus');
  const box = root?.querySelector(`[data-amt="${amt}"]`)?.closest('.opt')?.querySelector('.box');
  if(!box){ coinPlayer?.pause(); return; }
  if(coinWrap.parentElement!==box) box.insertBefore(coinWrap, box.firstChild);
  sizeCoins();
  if(ab.sel===amt) coinPlayer?.pause(); else coinPlayer?.play();
}

/* band */
/* Astrologer flow only. A chat needs MIN_MINUTES of talk time in the wallet, so the rupee
   threshold moves with whoever you tapped — 4 min is ₹100 at ₹25/min but ₹60 at ₹15/min.
   Radhika's call: the minutes are the fixed rule, not the rupees. */
const MIN_MINUTES=4;
// The astrologer's standing rate, before any promo. The continue-chat flow sets flowRate to the
// offered ₹5, so the struck-out figure and the "% off" both have to come from here.
const LIST_RATE=25;
const creditFor=v=>v+bonusFor(v)+couponFor();
// what the wallet credit actually costs per minute: you pay `v`, you can talk for credit/rate.
// Always ≤ the list rate, since the bonus is never negative — but it does NOT fall monotonically
// across the tiles on this bonus table (₹250 is the cheapest, then it climbs again). Flagged;
// she has seen the numbers and accepted "it will drop and rise".
// v1's settled rule: the per-minute figure always reads the BASE bonus, never the coupon-inflated
// one, so a coupon can never push the advertised rate back up. (Moot today — the coupon and
// astrologer flows are different routes — but this is the bug that cost her a week in v1.)
const effRate=v=>Math.round(flowRate*v/(v+baseBonusFor(v)));
const minutesFor=v=>creditFor(v)/flowRate;
const shortOfMin=()=>ab.cflow&&flowRate&&minutesFor(ab.sel)<MIN_MINUTES;
function bandInner(){
  // The astrologer bands come FIRST: on this flow ₹50 is a blocker, not a missed bonus, so it
  // must not fall through to the gold "you're missing out" copy.
  if(shortOfMin()) return `<div class="bandin"><img src="${I['warning-red']}" alt=""><div><p class="l1">To connect with <b>${flowAstro}</b>,</p><p class="l2">need wallet balance of <b>${MIN_MINUTES} min (₹${MIN_MINUTES*flowRate})</b></p></div></div>`;
  // Continue-chat promo. Sits on EVERY tile including ₹50 — it advertises the first five minutes,
  // not the recharge, so which amount is picked doesn't change a word of it.
  if(ab.mode==='offer') return `<div class="bandin"><img class="tag" src="${I.discount}" alt=""><div><p class="l1">First 5 min with ${flowAstro} at</p><p class="rate"><b>₹${flowRate}/min</b><s>₹${LIST_RATE}/min</s><b class="off">(${Math.round((1-flowRate/LIST_RATE)*100)}% off)</b></p></div></div>`;
  // ASTRO50. Same on every tile — the ₹50 is flat, so no figure here moves with the selection.
  // The <b class="cd"> is what startCountdown()'s ticker rewrites each second.
  // discount-dark.svg is the same seal recoloured #065F41 — the coupon strip's own left-edge
  // green — because the default #039855 read as a brighter green sitting on a darker one.
  if(ab.mode==='coupon') return `<div class="bandin"><img class="tag" src="${I['discount-dark']}" alt=""><div><p class="l1">ASTRO 50 applied, <b>₹${COUPON_FLAT} extra</b></p><p class="l2">valid for <b class="cd">${cdText()}</b></p></div></div><img class="bn-stars" src="${I.stars}" alt="" aria-hidden="true"><span class="sweep"></span>`;
  if(ab.cflow&&flowRate){
    const arrows=`<span class="arrows" aria-hidden="true">${`<img src="${I['arrow-drift']}" alt="">`.repeat(3)}</span>`;
    return `<div class="bandin"><img class="tag" src="${I.discount}" alt=""><div><p class="l1">Connect with ${flowAstro} at</p><p class="rate"><b>₹${effRate(ab.sel)}/min</b><s>₹${flowRate}/min</s></p></div>${arrows}</div>`;
  }
  // The wallet flow gets this copy at EVERY amount, not just ₹50 — the green "Yay, you're earning
  // ₹X extra" band it used to show above ₹50 is gone. Keeping the words and the colour fixed is
  // what lets renderBand slide the strip in and out as one object; if it rewrote itself on the way
  // down you would see it change its mind mid-slide. It is only ever on screen at ₹50.
  if(isGold()||ab.wflow) return `<div class="bandin"><img src="${I.warning}" alt=""><div><p class="l1">You're missing out on a bonus</p><p class="l2">Pick ₹100 or more to get extra</p></div></div>`;
  const cd = `<b class="cd">${cdText()}</b>`;
  const l1 = ab.mode==='coupon' ? `<b>ASTRO50</b> applied${ab.noTimer?'':` · ends in ${cd}`}`
           : ab.mode==='offer'  ? `First 5 mins chat at <b>₹5/min</b> · <b>80% Off</b>`
           : `Recharge offer valid for ${cd}`;
  // deliberately does NOT name a coupon figure: the ₹50 top-up is not in this bonus table yet
  const l2 = `Extra credit lands in your wallet instantly`;
  return `<div class="bandin"><img class="tag" src="${I.discount}" alt=""><div><p class="l1">${l1}</p><p class="l2">${l2}</p></div></div>`;
}
function renderBand(){
  const red=shortOfMin(), promo=ab.mode==='offer', coup=ab.mode==='coupon';
  // The astrologer, promo and coupon variants own the band outright — no gold, no countdown tint.
  // The promo one deliberately overrides gold too, so ₹50 keeps the offer copy; the coupon one
  // doesn't need to, because with COUPON_FLAT applied ₹50 is no longer a zero-bonus tile.
  const special = red||promo||coup||(ab.cflow&&flowRate);
  // The wallet flow is gold at every amount now, not just at ₹50, because its band has no other
  // job — see bandInner. `off` is what actually decides whether you can see it: parked behind the
  // SKU card unless ₹50 is the selection.
  const g=!special&&(ab.wflow||isGold());
  const off=!special&&ab.wflow&&!isGold();
  // v1's rule: deeper green only while a countdown is showing, lighter green without one.
  // The wallet flow's copy carries no countdown, so it lands on the lighter one.
  const timed = !g && !red && !promo && !coup && !ab.cflow && !ab.wflow;
  for(const el of [A('band'),A('band3')]){
    // Only the wallet flow's band fades out to white; every other flow keeps the flat gold.
    el.className=(el.id==='band'?'banner':'band3')+(red?' red':'')+(promo?' bn-promo':'')+(coup?' coupon':'')+(g?' gold':'')+(g&&ab.wflow?' gfade':'')+(timed?' bn-dark':'')+(off?' bn-off':'');
    el.innerHTML=bandInner();
  }
  // A running countdown is the one moving thing that should hold the eye, so the badges' light
  // sweep stands down while it ticks. Read off the rendered band rather than re-deriving which
  // modes carry a timer — the copy is the only authority on whether a .cd is actually showing.
  amRoot.classList.toggle('timed', !!A('band').querySelector('.cd'));
  // And the badges only sweep while the pick earns nothing — see the .lure rule in the CSS.
  amRoot.classList.toggle('lure', isGold());
  // With the band hidden the SKU card slides up into its place rather than leaving a gap.
  amRoot.classList.toggle('bandoff', off);
}

/* card */
let animToken=0;
function renderCard(animate=true){
  // The coupon counts towards the card even though it is no longer part of "bonus", so a ₹50
  // under ASTRO50 still shows ₹100 and stays green rather than falling back to the gold card.
  const v=ab.sel, b=bonusFor(v), cpn=couponFor(), total=v+b+cpn, g=(b+cpn)===0;
  A('card').className='ac '+(g?'gold':'green');
  A('payblock').classList.toggle('gold',g);
  A('cardE').hidden=g;                       // ₹50 earns no bonus; drop the eyebrow
  const n=A('cardN'), token=++animToken;
  const setN=x=>{ab.shown=x;n.textContent=fmt(x);alignCardRupee()};
  if(!animate||RM||b===0){setN(total);return}
  // count to the recharge amount, fly the bonus chip into the card, then count the bonus on
  const from=ab.shown??v;
  const d1=from===v?0:360, flight=640, d2=700, t0=performance.now();
  const ease=p=>1-Math.pow(1-p,3), lerp=(a,z,p)=>Math.round(a+(z-a)*ease(p));
  flyBonus(b,d1,flight);
  let landed=false;
  const step=t=>{ if(token!==animToken) return;
    const e=t-t0;
    if(e<d1) setN(lerp(from,v,e/d1));
    else if(e<d1+flight) setN(v);
    else if(e<d1+flight+d2){ if(!landed){landed=true;thump()} setN(lerp(v,total,(e-d1-flight)/d2)); }
    else { setN(total); return }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function thump(){
  const a=amRoot.querySelector('.ac .amt'); if(!a) return;
  a.classList.remove('absorb'); void a.offsetWidth; a.classList.add('absorb');
}
// Lift the chosen tile's "+₹X" chip off the tile and arc it into the card. Both ends are
// measured at call time, so it works from the collapsed row and the open grid alike.
// The iteration easing MUST stay linear with per-keyframe easing — a single front-loaded
// curve remaps progress and the chip arrives long before the count starts.
function flyBonus(b,delay,dur){
  const root=ab.open?A('grid'):A('skus');
  const chip=root.querySelector(`[data-amt="${ab.sel}"]`)?.closest('.col')?.querySelector('.chip');
  const amt=amRoot.querySelector('.ac .amt');
  if(!chip||!amt) return;
  const sr=amRoot.getBoundingClientRect(), a=chip.getBoundingClientRect(), z=amt.getBoundingClientRect();
  const fly=document.createElement('div');
  fly.className='flyer';
  fly.innerHTML=`<p>+₹<b>${fmt(b)}</b> more</p>`;   // must match the chip it flies out of
  Object.assign(fly.style,{left:(a.left-sr.left)+'px',top:(a.top-sr.top)+'px',width:a.width+'px',height:a.height+'px'});
  amRoot.appendChild(fly);
  const dx=(z.left+z.width/2)-(a.left+a.width/2), dy=(z.top+z.height/2)-(a.top+a.height/2);
  // Scale only ever DECREASES — her call. It used to balloon to 1.3 at the top of the arc and
  // shrink back; now it starts at full size and shrinks the whole way in, so the chip reads as
  // being absorbed by the card rather than popping at the user. Keep every value <= 1.
  // VELOCITY PROFILE — fast, slow, fast, in that order, and that is the whole brief:
  //   0 → .26   leaves the tile hard and decelerates into the apex  (ease-OUT)
  //   .26 → .40 the direction change: 4px of travel over 14% of the flight, so it hangs
  //   .40 → 1   falls away from the apex accelerating the whole way (ease-IN, no tail)
  // The old curve did the opposite at the finish: it reached the card at offset .9 on an
  // ease-out and then sat there for 64ms, which read as arriving slowly and stopping.
  // Landing on offset 1 also puts the arrival on the same frame as thump().
  // Speed profile, which IS the brief: fast off the tile → almost stopped at the top of the arc
  // where it changes direction → accelerating all the way into the card, fastest on impact.
  // Two things this has to get right, both of which were wrong in earlier passes:
  //  1. The fall is ONE keyframe interval. Every extra waypoint restarts its own easing curve
  //     from zero velocity — a mid-flight waypoint measured as a drop from 2840 to 70 px/s, a
  //     visible hitch just before the card. The .86 keyframe carries opacity alone, which does
  //     not split the transform interval.
  //  2. The fall curve must stay near free fall (distance ∝ t²). cubic-bezier(.4,0,.8,.7) covers
  //     8/30/62/85% of the drop at quarter/half/three-quarter/nine-tenths time against free
  //     fall's 6/25/56/81. A steeper ease-in reads as hovering and then teleporting: the curve
  //     this replaced was still only 21% down the screen with 80% of the flight gone.
  fly.animate([
    {offset:0,  opacity:0,transform:'translate(0,0) scale(1) rotate(0deg)',easing:'cubic-bezier(.12,.8,.25,1)'},
    {offset:.22,opacity:1,transform:`translate(${dx*.03}px,-76px) scale(.92) rotate(-9deg)`,easing:'cubic-bezier(.45,0,.55,1)'},
    {offset:.34,          transform:`translate(${dx*.12}px,-68px) scale(.86) rotate(-3deg)`,easing:'cubic-bezier(.4,0,.8,.7)'},
    {offset:.86,opacity:1},
    {offset:1,  opacity:0,transform:`translate(${dx}px,${dy}px) scale(.34) rotate(5deg)`},
  ],{duration:dur,delay,easing:'linear',fill:'both'}).finished.then(()=>fly.remove(),()=>fly.remove());
}
// Top-align the ₹ with the cap height of the number, using real glyph metrics.
function alignCardRupee(){
  const a=amRoot?.querySelector('.ac .amt'); if(!a) return;
  const cx=(alignCardRupee.cv||(alignCardRupee.cv=document.createElement('canvas'))).getContext('2d');
  const r=a.querySelector('.r'), n=a.querySelector('.n');
  const m=(el,t)=>{const c=getComputedStyle(el),size=parseFloat(c.fontSize),lh=parseFloat(c.lineHeight)||size;
    cx.font=`${c.fontWeight} ${size}px ${c.fontFamily}`; const mm=cx.measureText(t);
    const asc=mm.fontBoundingBoxAscent??size*.97, desc=mm.fontBoundingBoxDescent??size*.24;
    return (lh-(asc+desc))/2+asc-mm.actualBoundingBoxAscent};
  r.style.marginTop=(m(n,n.textContent)-m(r,'₹')).toFixed(2)+'px';
}

/* open list + scroll indicator */
let amHideTimer, amSwitchTimer;
function layoutOpen(){
  if(!amRoot) return;
  const wrap=A('openwrap'), sc=A('openscroll'), bar=A('sbar'), thumb=A('sthumb');
  const wrapTop=wrap.getBoundingClientRect().top;
  const cardTop=A('card').getBoundingClientRect().top-wrapTop;   // visible height above the card
  A('scrollpad').style.height=Math.max(0,wrap.clientHeight-cardTop+16)+'px';
  bar.style.height=Math.max(40,cardTop-28)+'px';
  const view=cardTop, total=sc.scrollHeight-(wrap.clientHeight-cardTop);
  const trackH=bar.clientHeight, h=Math.max(28,Math.round(trackH*Math.min(1,view/total)));
  const max=sc.scrollHeight-sc.clientHeight, p=max>0?sc.scrollTop/max:0;
  thumb.style.height=h+'px';
  thumb.style.transform=`translateY(${Math.round((trackH-h)*p)}px)`;
}
function flashBar(ms=1400){
  const bar=A('sbar'); bar.classList.add('on');
  clearTimeout(amHideTimer); amHideTimer=setTimeout(()=>bar.classList.remove('on'),ms);
}
function setOpen(on){
  ab.open=on;
  if(on) renderTiles();                        // fill the grid before it animates in
  amRoot.classList.toggle('open',on);
  amRoot.classList.add('switching');
  clearTimeout(amSwitchTimer);
  // the layers are mid-transform while switching, so re-measure once they have settled
  amSwitchTimer=setTimeout(()=>{amRoot.classList.remove('switching');layoutOpen()},400);
  A('openwrap').setAttribute('aria-hidden',!on);
  A('seeMore').setAttribute('aria-expanded',on);
  if(on){A('openscroll').scrollTop=0;requestAnimationFrame(()=>{layoutOpen();flashBar(2000)})}
  else renderTiles();
}

/* receipt outline — drawn at 1:1 so the dashes and the 1px stroke stay undistorted.
   Each half of the bottom is ONE cubic from the side to the centre; a corner arc glued to a
   bow is tangent-continuous but not curvature-continuous and the eye reads the jump as a
   crease. DROP governs roundness (40 -> 21.6px, 56 -> 27px, 72 -> 31.3px), not the handles. */
const RCPT_R=32, DROP=56;
function drawRcpt(){
  if(!amRoot) return;
  const el=A('rcpt'), o=.5;                    // half the stroke, so it sits inside the box
  const W=el.clientWidth-o, H=el.clientHeight-o;
  const m=(W+o)/2, B=H-DROP, HV=DROP, HH=(W-m)*.18;
  A('rcptLine').setAttribute('viewBox',`0 0 ${el.clientWidth} ${el.clientHeight}`);
  A('rcptPath').setAttribute('d',
    `M${o} ${RCPT_R}A${RCPT_R} ${RCPT_R} 0 0 1 ${o+RCPT_R} ${o}H${W-RCPT_R}A${RCPT_R} ${RCPT_R} 0 0 1 ${W} ${RCPT_R}`+
    `V${B}C${W} ${B+HV} ${W-HH} ${H} ${m} ${H}`+
    `C${o+HH} ${H} ${o} ${B+HV} ${o} ${B}Z`);
}

function select(v){
  // Re-tapping the selected amount replays the reveal: rewind the counter and run it again.
  if(v===ab.sel) ab.shown=v;
  ab.sel=v;
  renderTiles(); renderBand(); renderCard(); renderSummary();
  const c=A('card');                           // replay the Z tip on every pick
  c.classList.remove('tilt'); void c.offsetWidth; c.classList.add('tilt');
}

// Called by mount() once the screen is in the DOM. Everything above assumes amRoot is set.
function initAM(root){
  amRoot=root;
  ab.open=false; ab.sumOpen=false; ab.pmOpen=false; ab.shown=null;
  renderTiles(); renderBand(); renderCard(false); renderSummary(); renderPM(); drawRcpt();
  // Once per page; on a remount the surviving canvas is re-parented into the new root by
  // mountCoins(), which renderTiles() has just called.
  initCoins();
  A('openscroll').addEventListener('scroll',()=>{layoutOpen();flashBar()},{passive:true});
  root.addEventListener('click',e=>{
    // With the payment summary open the amounts are locked — the tap just closes the summary.
    const opt=e.target.closest('[data-amt]');
    if(opt&&!ab.sumOpen){select(+opt.dataset.amt);return}
    if(e.target.closest('#seeMore')){setOpen(true);return}
    if(e.target.closest('#seeLess')){setOpen(false);return}
    if(e.target.closest('#sumToggle')){setSumOpen(!ab.sumOpen);return}
    if(e.target.closest('#payWith')){setPM(true);return}
    if(e.target.closest('[data-pmclose]')){setPM(false);return}
    const pm=e.target.closest('[data-pm]');
    if(pm){ab.pm=pm.dataset.pm;renderPM();setTimeout(()=>setPM(false),180);return}
    if(ab.sumOpen&&!e.target.closest('.payblock')) setSumOpen(false);
  });
  root.addEventListener('keydown',e=>{
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-amt]')&&!ab.sumOpen){e.preventDefault();select(+e.target.dataset.amt)}
    if(e.key==='Escape'){if(ab.pmOpen)setPM(false);else if(ab.sumOpen)setSumOpen(false)}
  });
  if(document.fonts) document.fonts.ready.then(()=>{alignCardRupee();layoutOpen()});
}

/* ---------- router ---------- */
function mount(html, anim){
  const old=[...phone.children];
  const cur=phone.querySelector('.screen');
  if(!anim||!cur||RM){ phone.innerHTML=html; afterMount(); return; }
  const holder=document.createElement('div'); holder.innerHTML=html; const neu=holder.firstElementChild;
  const ease='cubic-bezier(.2,.8,.2,1)', dur=340;
  const cleanup=()=>{ old.forEach(n=>n.remove()); neu.style.boxShadow=''; };
  if(anim==='in-right'){ // wallet page slides in from the right, over the current screen
    neu.style.boxShadow='-8px 0 24px rgba(16,24,40,.18)';
    phone.appendChild(neu);
    cur.animate([{transform:'translateX(0)'},{transform:'translateX(-24%)'}],{duration:dur,easing:ease,fill:'forwards'});
    neu.animate([{transform:'translateX(100%)'},{transform:'translateX(0)'}],{duration:dur,easing:ease}).onfinish=cleanup;
  } else { // 'out-right': wallet page slides back out to the right, revealing the screen underneath
    phone.insertBefore(neu, phone.firstChild);
    cur.style.boxShadow='-8px 0 24px rgba(16,24,40,.18)';
    old.filter(n=>n!==cur).forEach(n=>n.remove());
    neu.animate([{transform:'translateX(-24%)'},{transform:'translateX(0)'}],{duration:dur,easing:ease});
    cur.animate([{transform:'translateX(0)'},{transform:'translateX(100%)'}],{duration:dur,easing:ease,fill:'forwards'}).onfinish=()=>cur.remove();
  }
  afterMount();
}
// The AM screen binds its own listeners, so they have to be re-made after every mount.
function afterMount(){ const am=phone.querySelector('.screen.am'); if(am) initAM(am); else amRoot=null; }
function openAB(mode,sel,banner=false,auto=true,extra){
  ab={mode,sel,banner,shown:null,cd:0,...extra};
  // The band always carries a countdown on this screen, so the default flows get one too.
  startCountdown(mode==='coupon'?5*3600:OFFER_SECONDS);
  mount(renderAB(), phone.querySelector('.screen.am')?null:'in-right');
  if(auto)later(()=>renderCard(true),450);
}
function withPopup(kind,mode,onDone){
  openAB(mode,50,false,false);
  phone.insertAdjacentHTML('beforeend',popup(kind));
  later(()=>{const o=phone.querySelector('.overlay');if(o){o.style.transition='opacity .25s';o.style.opacity='0';later(()=>{o.remove();onDone();renderCard(true)},250)}},2300);
}
function go(route,rate){
  clearTimers();
  flowRate = rate ? +rate : null; // whatever the tapped card charges; null when none was tapped
  document.getElementById('flowsSheet').classList.remove('open');
  switch(route){
    case 'home': mount(renderHome(), phone.querySelector('.screen.am')?'out-right':null); break;
    // wflow marks THIS route only — post3 also runs flowType 'wallet' but must not pick up the
    // wallet band's copy or its gold fade. See bandInner()/renderBand().
    case 'wallet': flowType='wallet'; flowAstro=''; openAB('default',100,false,true,{wflow:true}); break;
    // cflow = came from an astrologer card, so the band talks about connecting to THEM: the
    // red "not enough to connect" strip below the 4-min minimum, the green rate strip above it.
    case 'listingChat': flowType='insufficient'; flowAstro='Astro Hemali'; flowRate=flowRate||15; mount(renderLow()); later(()=>openAB('default',100,false,true,{cflow:true}),1600); break;
    case 'again': flowType='coupon'; flowAstro='Astro Vipasana'; flowRate=flowRate||5; mount(renderLow()); later(()=>withPopup('coupon','coupon',()=>later(()=>{ab.banner=true;startCountdown(5*3600);renderBand()},800)),1600); break;
    case 'history': mount(renderChat()); break;
    case 'post3': flowType='wallet'; flowAstro=''; openAB('default',100,false,true,{rows:2,coin:500}); break;
    case 'continue': flowType='offer'; flowAstro='Astro Vipasana'; flowRate=flowRate||5; mount(renderLow()); later(()=>withPopup('offer','offer',()=>{ab.banner=true;startCountdown(5*60);renderBand()}),1600); break;
  }
}
// v1's global tap router. The Add Money screen binds its own handler in initAM(), so this one
// only has to catch [data-go] and leave the rest alone.
phone.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]');
  if(t) return go(t.dataset.go,t.dataset.rate);
  if(e.target.closest('.screen.am')) return;   // handled by initAM()
  phone.classList.add('hot-reveal');setTimeout(()=>phone.classList.remove('hot-reveal'),450);
});
document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.jump)));
document.getElementById('flowsBtn').addEventListener('click',()=>document.getElementById('flowsSheet').classList.add('open'));
document.getElementById('flowsSheet').addEventListener('click',e=>{if(e.target.id==='flowsSheet')e.currentTarget.classList.remove('open')});

fit();
const start=new URLSearchParams(location.search).get('start');
go(start||'home');
</script>
</body>
