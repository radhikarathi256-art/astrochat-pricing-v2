<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>AstroChat · Bonus highlight prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto:wght@500&display=swap" rel="stylesheet">
<!-- dotLottie player for the low-balance loader. Unlike everything else in this file it is not
     inlined, so the loader needs a network connection; the static wallet image stays in the
     markup as a fallback and is hidden only once the component actually upgrades. -->
<script type="module" src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
<style>
:root{
  --brand:#EF6939;--brand-500:#F28761;
  --g50:#F9FAFB;--g100:#F2F4F7;--g200:#EAECF0;--g300:#D0D5DD;--g400:#98A2B3;--g500:#667085;--g600:#475467;--g700:#344054;--g800:#1D2939;
  --s50:#ECFDF3;--s200:#A6F4C5;--s500:#12B76A;--s600:#039855;--s700:#027A48;
  --ab-bg:#EEF0F3;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff}
body{font-family:var(--font);color:var(--g800);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
img{display:block}
/* role=button divs (tiles, pay card) take :focus-visible on a mouse click in Chrome, which is
   where the blue ring came from. Keyboard focus still shows, in a neutral grey, never blue. */
:focus-visible{outline:2px solid rgba(16,24,40,.35);outline-offset:2px}
:where(.tile,.ps-card,[role=button],[role=radio],button):focus:not(:focus-visible){outline:none}

/* ---------- shell ---------- */
.shell{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:760px;color:var(--g600);font-size:12px}
.toolbar b{color:var(--g800);font-weight:600;margin-right:4px}
.toolbar button{background:#2f2f33;border:1px solid #707076;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;text-align:center}
.toolbar button:hover{background:#3b3b40}
.stage{position:relative;flex-shrink:0}
.phone{position:absolute;left:0;top:0;width:360px;background:#fff;overflow:hidden;transform-origin:0 0;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.screen{position:absolute;inset:0;overflow:hidden}
.hot-reveal [data-hot]{outline:2px solid rgba(16,24,40,.5)!important;outline-offset:-2px;background-color:rgba(16,24,40,.1)!important}
.flows-btn{display:none}
.flows-sheet{display:none}

/* mobile: the prototype is the whole screen */
body.mobile .shell{padding:0;gap:0;justify-content:flex-start;align-items:flex-start}
body.mobile .toolbar{display:none}
body.mobile .phone{border-radius:0;box-shadow:none}
.flows-sheet.open{display:flex;position:fixed;inset:0;z-index:101;background:rgba(0,0,0,.45);align-items:flex-end}
.flows-btn,.flows-sheet .panel{zoom:var(--ui,1)}
.flows-sheet .panel{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;animation:up .25s ease-out}
.flows-sheet h4{font-size:15px;font-weight:700;color:var(--g800);margin-bottom:4px}
.flows-sheet .panel button{border:1px solid var(--g300);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500;color:var(--g700)}
.flows-sheet .panel button small{display:block;font-weight:400;font-size:12px;color:var(--g500);margin-top:2px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* ---------- photos (uploaded) / stand-ins ---------- */
.photo{border-radius:50%;overflow:hidden;flex-shrink:0;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:#9a3412;background:radial-gradient(circle at 35% 30%,#ffe7d6,#f9c6a6 70%)}

/* ---------- HOME ---------- */
.home{display:flex;flex-direction:column;background:#fff}
.home-head{border-bottom:1px solid var(--g300);flex-shrink:0;background:#fff}
.home .topnav{height:64px;display:flex;align-items:center;gap:16px;padding-left:16px}
.brand{display:flex;gap:7px;align-items:center}
.home .logo{position:relative;width:95.4px;height:20px}
.home .logo img,.home .logo span{position:absolute}
.home .logo .a{left:0;top:0;width:38.8px;height:19.7px}
.home .logo .b{left:38.8px;top:7px;width:12.6px;height:12.6px}
.home .logo .c{left:52.2px;top:0;width:37.3px;height:19.7px}
.home .logo span{left:89.4px;top:5px;height:15px;width:6px;display:flex;align-items:center;justify-content:center}
.home .logo span i{transform:rotate(-90deg);font-style:normal;font-size:6.4px;line-height:6px;color:var(--brand);white-space:nowrap}
.navright{flex:1;display:flex;gap:12px;align-items:center;justify-content:flex-end;padding-right:8px}
.wpill{position:relative;background:var(--g700);display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 2px 4px;border-radius:16px 16px 12px 12px;overflow:hidden}
.wpill .inner{background:#fff;border:1px solid var(--g300);border-radius:20px;display:flex;gap:8px;align-items:center;padding:3px 4px 3px 6px;position:relative;z-index:1}
.wpill .inner p{font-size:14px;color:#2d2d2d}
.wpill .cb{font-size:10px;color:#fff;letter-spacing:-.32px;white-space:nowrap;position:relative;z-index:1}
/* light sweep: kept for the ASTRO50 coupon banner (both its timer and non-timer states).
   The offer banner deliberately has none. */
.sweep{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
/* Travels on TRANSFORM, not `left`. Animating `left` re-runs layout and repaints the whole band
   on every frame, which is what made it stutter; a transform stays on the compositor.
   The 475% is not arbitrary: the old travel was left -60% → 130%, i.e. 190% of the BAND's width,
   and translateX percentages resolve against the ELEMENT's own width, which is 40% of the band —
   190/40 = 475. Change `width:40%` and this number has to be rederived. */
.sweep::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);will-change:transform;animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%,40%{transform:translateX(0) skewX(-18deg)}80%,100%{transform:translateX(475%) skewX(-18deg)}}

/* wallet chip: single row, gift <-> add alternating (option I) */
.wchip{height:32px;display:flex;align-items:center;gap:6px;padding:0 3px 0 9px;background:#fff;border:1px solid var(--g300);border-radius:16px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--g800);transition:transform .12s}
.wchip:active{transform:scale(.96)}
.wchip .bal{display:flex;align-items:center;gap:5px}
.swap{position:relative;width:26px;height:26px;flex-shrink:0}
.swap .lay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;animation-duration:6s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.25,1)}
.swap .lg{background:var(--s50);border:1px solid #abefc6;animation-name:swapGift}
.swap .lp{animation-name:swapPlus}
.swap .lp img{width:24px;height:24px}
@keyframes swapGift{0%,40%{opacity:1;transform:scale(1) rotate(0)}50%,90%{opacity:0;transform:scale(.3) rotate(-120deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes swapPlus{0%,40%{opacity:0;transform:scale(.3) rotate(120deg)}50%,90%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(.3) rotate(120deg)}}
.giftw{position:relative;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;font-size:15px;line-height:1}
.home .giftw .g{display:inline-block;transform-origin:50% 85%;animation:gift6 6s ease-in-out infinite}
.giftw i{position:absolute;width:4px;height:4px;border-radius:50%;background:#fdb022;opacity:0;animation:spark6 6s ease-out infinite}
.giftw i:nth-of-type(1){top:-1px;right:-2px}
.giftw i:nth-of-type(2){top:3px;left:-3px;width:3px;height:3px;animation-delay:.1s;background:#12b76a}
.giftw i:nth-of-type(3){bottom:0;right:-3px;width:3px;height:3px;animation-delay:.2s;background:#f472b6}
@keyframes gift6{0%,10%,34%,100%{transform:rotate(0) scale(1)}14%{transform:translateY(-2px) rotate(-14deg) scale(1.18)}18%{transform:translateY(-2px) rotate(12deg) scale(1.18)}22%{transform:rotate(-8deg) scale(1.1)}26%{transform:rotate(5deg)}30%{transform:rotate(0)}}
@keyframes spark6{0%,12%{opacity:0;transform:scale(.2)}17%{opacity:1;transform:scale(1.2)}28%,100%{opacity:0;transform:scale(.4) translateY(-4px)}}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.home .chip{height:32px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:3px 12px;border:1px solid var(--g300);border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.05);font-size:12px;line-height:18px;color:var(--g700);white-space:nowrap}
.vline{width:1px;height:32px;background:var(--g300);flex-shrink:0}
.home-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 16px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.home-scroll::-webkit-scrollbar{display:none}
.promo{flex-shrink:0;height:60px;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;background:linear-gradient(100deg,#8a5bd6 0%,#b48ae8 55%,#d9c4f7 100%);color:#fff}
.promo.img{padding:0;background:none}
.promo.img img{width:100%;height:100%;object-fit:contain}
.promo h5{font-size:15px;font-weight:800;line-height:20px;white-space:nowrap}
.promo p{font-size:11px;line-height:15px;opacity:.95;white-space:nowrap}
.promo p b{font-weight:700}
.promo .rn{white-space:nowrap;background:#fff;color:#7a45c9;font-weight:700;font-size:13px;border-radius:10px;padding:9px 10px;box-shadow:0 2px 8px rgba(60,20,120,.25)}
.recent{flex-shrink:0;border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(112.5deg,#fefdf8 1.3%,#ffedd2 49.8%,#fefdf8 104%)}
.recent-h{display:flex;justify-content:space-between;align-items:center}
.recent-h p{font-weight:600;font-size:16px;line-height:24px;color:var(--g800)}
.recent-h span{font-weight:600;font-size:12px;color:var(--brand)}
.rc-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -8px;padding:4px 8px 10px}
.rc-row::-webkit-scrollbar{display:none}
.home .rc{background:#fff;flex-shrink:0;display:flex;gap:6px;padding:8px 6px;border-radius:16px;box-shadow:0 0 16px 2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.06)}
.rc-name{font-weight:600;font-size:16px;line-height:24px;color:var(--g700)}
.price{display:flex;gap:6px;align-items:center;height:23px}
.price s{font-weight:500;font-size:12px;color:var(--g400)}
.price b{font-weight:600;font-size:14px;line-height:20px;color:var(--s700)}
.rc-btns{display:flex;gap:6px;margin-top:5px}
.btn-o,.btn-f{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--brand);border-radius:8px;font-weight:600;font-size:12px;line-height:18px;box-shadow:0 1px 2px rgba(16,24,40,.05);white-space:nowrap}
.btn-o{background:#fff;color:var(--brand);padding:6px 8px}
.btn-f{background:var(--brand);color:#fff;padding:6px 14px;flex:1}
.avwrap{position:relative;flex-shrink:0}
.odot{position:absolute;border:solid #fff}
.sec-title{font-weight:600;font-size:16px;line-height:24px;color:#41404d}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:#fff;height:238px;flex-shrink:0;padding:12px 12px 16px;border-radius:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;box-shadow:0 0 16px 2px rgba(16,24,40,.08),0 2px 4px -2px rgba(16,24,40,.06)}
.card-top{flex:1;display:flex;gap:16px;align-items:center}
.card-name{font-weight:700;font-size:20px;line-height:30px;color:var(--g700)}
.meta{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:500;font-size:14px;line-height:20px;color:var(--g600)}
.rating{display:flex;gap:4px;align-items:center;border:1px solid var(--g200);border-radius:4px;padding:2px 6px}
.dot4{width:4px;height:4px;border-radius:50%;background:var(--g500);flex-shrink:0}
.line{display:flex;gap:4px;align-items:center;font-weight:500;font-size:14px;line-height:20px;color:var(--g500)}
.card-price{display:flex;gap:6px;align-items:center;line-height:28px}
.card-price s{font-weight:500;font-size:14px;color:var(--g400)}
.card-price b{font-weight:600;font-size:18px;color:var(--s700)}
.card-btns{display:flex;gap:12px}
.card-btns button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center;background:var(--brand);border:1px solid var(--brand);border-radius:12px;padding:8px 14px;color:#fff;font-weight:600;font-size:14px;line-height:20px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.tabbar{flex-shrink:0;display:flex;border-top:1px solid var(--g300);background:#fff;padding:0 16px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 8px 24px;font-size:11px;line-height:16px;color:var(--g500)}
.home .tab.on{color:var(--brand-500);font-weight:600}

/* ---------- ADD BALANCE ---------- */
.ab{background:var(--ab-bg)}
.ab-head{position:absolute;top:0;left:0;right:0;z-index:5;background:#fff}
.ab-nav{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.ab-title{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 0}
.ab-title .back{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.ab-title p{font-weight:600;font-size:16px;line-height:24px;color:var(--g700);white-space:nowrap}
.wbadge{background:var(--g100);border-radius:20px;display:flex;gap:8px;align-items:center;padding:4px 8px;font-weight:600;font-size:12px;line-height:18px;color:var(--g600)}
.ab-body{position:absolute;top:64px;left:0;right:0;bottom:0;overflow-y:auto;padding:24px 16px 170px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ab-body::-webkit-scrollbar{display:none}
/* square bottom corners: the wallet card sits on top of them, so rounding there only showed
   as two nicks of green either side of the card */
.ab .banner{position:relative;background:#039855;border-radius:16px 16px 0 0;overflow:hidden;margin-bottom:-20px;display:flex;gap:8px;align-items:center;padding:8px 16px 28px;color:#fff;font-size:12px;line-height:17px;font-weight:500;letter-spacing:.36px}
/* Dark green whenever a countdown is shown; the non-timer states use the lighter #039855. */
.ab .banner.bn-dark{background:#027A48}
.ab .banner b{font-weight:800;font-size:14px;letter-spacing:.42px;color:#fff;font-variant-numeric:tabular-nums}
.ab .banner .bn-txt{position:relative;z-index:1;flex:1;min-width:0}
/* decorative sparkle field tucked into the top-right corner, faded out towards the text.
   White at .2 so the brightest star lands ~14% over the band and reads as twinkle, not dots. */
.ab .banner .bn-stars{position:absolute;top:0;right:0;width:236px;height:44px;object-fit:cover;object-position:right top;pointer-events:none;z-index:0;opacity:.2;
  -webkit-mask-image:linear-gradient(to left,#000 8%,rgba(0,0,0,.45) 42%,transparent 78%);mask-image:linear-gradient(to left,#000 8%,rgba(0,0,0,.45) 42%,transparent 78%)}
/* no margin: the two lines are separate <p>s, but must sit exactly as far apart as the two
   wrapped lines of the green strip, which are spaced by line-height alone */
.ab .banner .bn-sub{font-size:12px;line-height:17px;font-weight:500;color:#fff}
.ab .banner .bn-sub b{font-weight:800;font-size:14px;letter-spacing:.42px;color:#fff}
.ab .banner .bn-sub s{opacity:.75}
.ab .banner .bn-icon{position:relative;z-index:1;flex:none;width:28px;height:28px;transform-origin:50% 50%;animation:seal 3.2s ease-in-out infinite}
/* discount seal: rests, then gives one wobble-pop so it reads as a stamp, not an alert */
@keyframes seal{0%,72%,100%{transform:scale(1) rotate(0)}79%{transform:scale(1.14) rotate(-9deg)}87%{transform:scale(1.14) rotate(9deg)}94%{transform:scale(1.05) rotate(0)}}
/* entrance: the banner starts fully tucked behind the "Your Wallet Gets" card (the card is
   z-index 2, the banner is not) and slides up out of it. Applied only on the first render —
   rerenderAB() re-mounts the whole screen on every tile tap, so without the .bn-in gate the
   banner would replay this and appear to jump each time a SKU is selected. */
/* gentle: a long, evenly-decelerating glide rather than the earlier fast-out snap, with the
   last few px eased almost to a stop and a short opacity ramp so it surfaces instead of popping */
.ab .banner.bn-in{animation:riseFromCard .72s cubic-bezier(.33,.9,.35,1) both;will-change:transform,opacity}
@keyframes riseFromCard{
  from{transform:translateY(100%);opacity:.55}
  55%{opacity:1}
  to{transform:translateY(0);opacity:1}}

/* insufficient balance warning (Figma 4604:32678): rises from behind the card when ₹50 is picked */
.warn-wrap{display:grid;grid-template-rows:0fr;margin-bottom:0;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1),margin-bottom .45s cubic-bezier(.2,.8,.2,1)}
.ab .warn-wrap.open{grid-template-rows:1fr;margin-bottom:-20px}
.warn-inner{min-height:0;overflow:hidden;border-radius:16px 16px 0 0}
.warn{display:flex;gap:8px;align-items:center;padding:8px 16px 28px;border-radius:16px 16px 0 0;background:#FEF3F2;
  background-image:linear-gradient(83.82deg,rgba(255,251,250,0) 4.67%,#F9DEDC 43.48%,#FFE4E2 67.28%,rgba(255,251,250,0) 107.86%);
  transform:translateY(24px);opacity:0;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.ab .warn-wrap.open .warn{transform:none;opacity:1}
.warn img{flex-shrink:0}
.warn p{flex:1;font-size:12px;line-height:18px;color:#560000;font-weight:400}
.warn b{font-weight:700}
.receipt{position:relative;z-index:2;background:#fff;border-radius:20px;box-shadow:0 6px 18px rgba(16,24,40,.08);padding-bottom:16px}
.receipt::before,.receipt::after{content:"";position:absolute;top:124px;width:28px;height:28px;border-radius:50%;background:var(--ab-bg);z-index:3}
.receipt::before{left:-14px;box-shadow:inset -4px 0 6px rgba(16,24,40,.08)}
.receipt::after{right:-14px;box-shadow:inset 4px 0 6px rgba(16,24,40,.08)}
.hero{position:relative;height:185px;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:5px}
.hero-top{position:relative;width:100%;height:118px;border:4px solid #fff;border-bottom:0;border-radius:20px 20px 0 0;padding:42px 2px 0;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(176.6deg,#f2f4f7 16.6%,#fff 87.3%);overflow:hidden}
.burst{position:absolute;left:50%;top:78px;width:520px;height:520px;margin:-260px 0 0 -260px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(152,162,179,.16) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 42px,#000 60px,#000 120px,transparent 200px);mask:radial-gradient(circle,transparent 42px,#000 60px,#000 120px,transparent 200px);
  animation:spin 120s linear var(--spin-delay,0s) infinite}
/* rays: grow from centre once per visit, only for ₹250+ */
.burst.grow{animation:raysGrow 1.6s cubic-bezier(.33,.4,.3,1) var(--grow-delay,0s) both,spin 120s linear var(--spin-delay,0s) infinite}
.burst.fadein{animation:raysIn .35s ease-out both,spin 120s linear var(--spin-delay,0s) infinite}
.burst.out{animation:raysOut .3s ease-in both,spin 120s linear var(--spin-delay,0s) infinite}
@keyframes raysGrow{from{clip-path:circle(8% at 50% 50%);opacity:0}15%{opacity:1}to{clip-path:circle(38% at 50% 50%);opacity:1}}
@keyframes raysIn{from{opacity:0}to{opacity:1}}
@keyframes raysOut{from{opacity:1}to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 85%);pointer-events:none}
/* "Your Wallet Gets" tab hanging from the card's top edge (Figma 4683:1267) */
.hero-label{position:absolute;z-index:2;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px 12px;background:#fff;border-radius:0 0 12px 12px;box-shadow:inset 0 -4px 6px rgba(0,0,0,.1);font-weight:500;font-size:12px;line-height:18px;letter-spacing:0;color:#667085;white-space:nowrap}
.hero-label img{width:14px;height:14px;flex-shrink:0}
.ab .amt{position:relative;z-index:1;display:flex;gap:0;align-items:baseline;justify-content:center;color:#1D2939;padding:0 8px}
.ab .amt::before{content:"";position:absolute;inset:-6px -46px;z-index:-1;pointer-events:none;border-radius:50%;opacity:0;
  background:radial-gradient(closest-side,rgba(18,183,106,.30),rgba(18,183,106,.14) 55%,rgba(18,183,106,0))}
.ab .amt.land::before{animation:heroFlash .95s ease-out}
.ab .amt.land .n{animation:heroLand .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes heroFlash{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.18)}}
@keyframes heroLand{0%{transform:scale(1)}35%{transform:scale(1.09)}70%{transform:scale(.98)}100%{transform:scale(1)}}
/* Figma 4683:1302 (₹100 and above) */
/* ₹ top-aligned with the digits: the flex line aligns the two baselines, then alignRupee()
   lifts the ₹ by the cap-height difference. Line-height plays no part, which is what the old
   half-leading maths got wrong — it left the ₹ sitting a few px low. */
.ab .amt .r{position:relative;width:auto;height:auto;font-weight:500;font-size:24px;line-height:24px;letter-spacing:-.48px;color:#344054}
.ab .amt .n{font-weight:700;font-size:42px;line-height:60px;letter-spacing:-2.1px;display:flex;white-space:nowrap}
.ab .amt .n .last{display:inline-block}
/* Figma 4683:1307: 1.5px outside stroke, gradient white → white (45%) → green #059152. ₹50 (4683:1300) has no stroke. */
.ab .amt .n{position:relative;isolation:isolate}
.ab .amt .n .stk{position:absolute;left:-8px;top:-6px;padding:6px 10px 6px 8px;z-index:-1;white-space:nowrap;pointer-events:none;color:transparent;
  -webkit-text-stroke:3px transparent;background:linear-gradient(118deg,#fff 0%,#fff 45%,#059152 100%);-webkit-background-clip:text;background-clip:text}
.ab .amt.s50 .n .stk{display:none}
.ab .amt.rolling .n .last{color:var(--g800);-webkit-text-stroke:1.5px rgba(3,152,85,.55);text-shadow:0 0 10px rgba(18,183,106,.35);animation:roll .12s linear infinite}
@keyframes roll{0%{transform:translateY(-6%)}50%{transform:translateY(6%)}100%{transform:translateY(-6%)}}
/* Figma 4683:1297 (₹50) */
.ab .amt.s50{gap:0}
.ab .amt.s50 .n{font-size:32px;letter-spacing:-1.6px}
.strip-wrap{position:absolute;z-index:1;width:286px;display:flex;flex-direction:column;align-items:center;
  /* centre of the strip sits on the notch centre (138px), whatever the strip height; 5.5px = half the pointer above it */
  left:50%;top:138px;transform:translate(-50%,calc(-50% - 5.5px))}
.strip-wrap .tip{width:15px;height:13px;margin-bottom:-2px}
/* The gradient is drawn 170% of the pill's width and slowly panned back and forth, so the bright
   core drifts across instead of sitting still. Every variant has to restate background-size:
   each one re-declares the `background` shorthand, which resets size back to auto. */
.strip{position:relative;width:100%;border-radius:12px;padding:9px 6px;text-align:center;font-weight:500;font-size:12px;line-height:16px;letter-spacing:.3px;color:var(--s600);overflow:hidden;
  background:linear-gradient(90deg,rgba(231,246,238,.3) 0%,rgba(216,249,228,.76) 25%,rgba(166,244,197,.85) 50%,rgba(217,249,228,.75) 75%,rgba(231,246,238,.3) 100%) center/170% 100% no-repeat;
  animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0% 0}to{background-position:100% 0}}
.strip::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 15%,rgba(255,255,255,.35) 50%,transparent 85%) 0 0/250% 100%;animation:shimmer 4.2s ease-in-out infinite}
@keyframes shimmer{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.strip span{position:relative;z-index:1}
.strip b{font-weight:800}


/* green bonus strip (Figma 4573:1698) */
.strip.gx{width:256px;padding:9px 5px;border-radius:12px;color:#027A48;font-size:12px;line-height:17px;font-weight:500;letter-spacing:.36px;text-align:center;white-space:normal;
  background:linear-gradient(90deg,rgba(231,246,238,.3) 15.865%,rgba(216,249,228,.763) 38.462%,rgba(166,244,197,.6) 50%,rgba(217,249,228,.75) 62.981%,rgba(231,246,238,.3) 86.377%) center/170% 100% no-repeat}
.strip.gx b{font-weight:800;font-size:14px;letter-spacing:.42px;color:#027A48}
/* ₹50 no-bonus strip (Figma 4683:1287): amber band, hugs its text */
.strip.nb50{width:auto;padding:9px 5px;border-radius:12px;color:#93370D;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.36px;white-space:nowrap;
  background:linear-gradient(90deg,rgba(254,240,199,.3) 15.865%,rgba(254,240,199,.763) 38.462%,#FEF0C7 50%,rgba(254,240,199,.75) 62.981%,rgba(254,240,199,.3) 86.377%) center/170% 100% no-repeat}
.strip.nb50 b{font-weight:800;font-size:14px;letter-spacing:.42px}
.strip.big{font-size:14px;line-height:20px;letter-spacing:.2px}
/* the pop has to re-list drift, or selecting a tile would replace it and freeze the gradient */
.strip.pulse{animation:pop .45s ease-out,drift 7s ease-in-out infinite alternate}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);column-gap:14px;row-gap:16px;padding:9px 16px 0}
.tile-col{display:flex;flex-direction:column;align-items:center}
.tile{position:relative;width:100%;height:auto;aspect-ratio:4/3;border:1px solid var(--g300);border-radius:14px;background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;color:var(--g700);transition:transform .12s ease}
.tile:active{transform:scale(.96)}
.tile .val{position:relative;display:flex;align-items:flex-start;padding-bottom:4px}
.tile .val i{font-style:normal;font-weight:700;font-size:12px;line-height:21px}
.tile .val span{font-weight:600;font-size:20px;line-height:26px}
.tile .sel{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none}
.tile .sel.justpick{animation:selin .28s cubic-bezier(.2,.8,.2,1)}
@keyframes selin{from{opacity:0;transform:translate(3px,-3px)}to{opacity:1;transform:none}}
/* tick sits where it was drawn in the corner (centre 81.8/93, 10.3/70) */
.ab .tile .tick{position:absolute;z-index:3;left:calc((100% + 2px) * .8178 - 1px);top:calc((100% + 2px) * .0884 - 1px);width:calc((100% + 2px) * .1242);height:calc((100% + 2px) * .1184);pointer-events:none}
.ab .tile .tick.justpick{animation:tickSpin .5s cubic-bezier(.3,1.5,.5,1) .05s both}
@keyframes tickSpin{from{opacity:0;transform:rotate(-120deg) scale(.3)}to{opacity:1;transform:none}}
.tile.justpick{animation:tilePop .3s ease-out}
@keyframes tilePop{0%{transform:scale(1)}45%{transform:scale(1.02)}100%{transform:scale(1)}}
.coins{position:absolute;right:-6px;top:-6px;width:34px;height:64px;pointer-events:none}
.coin{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#f5b82e 55%,#c98a10 100%);box-shadow:inset 0 -1px 0 rgba(120,70,0,.35),0 1px 2px rgba(120,70,0,.25)}
.coin::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px solid rgba(255,240,180,.7)}
.coin.c1{width:16px;height:16px;right:8px;top:2px;animation:bob 1.6s ease-in-out infinite}
.coin.c2{width:20px;height:20px;right:0;top:22px;animation:bob 1.6s ease-in-out .3s infinite}
.coin.c3{width:12px;height:12px;right:12px;top:46px;animation:bob 1.6s ease-in-out .6s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-3px) rotateY(60deg)}}

.addfly{position:absolute;left:calc(100% + 6px);top:14px;white-space:nowrap;font-size:14px;line-height:20px;font-weight:700;letter-spacing:0;color:#027A48;background:var(--s50);border:1px solid #abefc6;border-radius:10px;padding:1px 7px;opacity:0;transform:translateY(10px) scale(.7);pointer-events:none;transition:opacity .25s ease-out,transform .4s cubic-bezier(.2,1.4,.4,1)}
.addfly.in{opacity:1;transform:none}
.addfly.merge{opacity:0;transform:translateX(-30px) scale(.5);transition:opacity .55s ease-in,transform .7s cubic-bezier(.5,0,.8,.4)}
.bonus.nudge{border:0;cursor:pointer;font-size:11px;letter-spacing:0;padding:4px 7px;background:linear-gradient(180deg,#F79009,#DC6803);box-shadow:0 2px 6px rgba(220,104,3,.35);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-2px)}86%{transform:translateY(0)}92%{transform:translateY(-1px)}}
.ab .coinfall{position:absolute;inset:0;border-radius:13px;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(90deg,#000 0 21%,transparent 24% 76%,#000 79% 100%);mask-image:linear-gradient(90deg,#000 0 21%,transparent 24% 76%,#000 79% 100%)}
.ab .coinfall .coin{position:absolute;top:0;opacity:0;animation:coinFall 3.6s linear infinite}
.ab .coinfall{opacity:1;transition:opacity .2s ease}
.ab .tile[aria-pressed="true"] .coinfall{opacity:0} /* selected tile: stop the coin shower */
.ab .coinfall .coin:nth-child(1){left:2%;width:15px;height:15px;animation-delay:0s}
.ab .coinfall .coin:nth-child(2){left:81%;width:15px;height:15px;animation-delay:.9s}
.ab .coinfall .coin:nth-child(3){left:4%;width:13px;height:13px;animation-delay:1.8s}
.ab .coinfall .coin:nth-child(4){left:83%;width:13px;height:13px;animation-delay:2.7s}
.ab .coinfall .coin:nth-child(5){left:1%;width:14px;height:14px;animation-delay:3.3s}
@keyframes coinFall{0%{transform:translateY(-22px) rotate(0);opacity:0}12%{opacity:.95}80%{opacity:.95}100%{transform:translateY(82px) rotate(220deg);opacity:0}}
.tile .val{z-index:1}
.tile .sel{z-index:2}
.bonus{position:relative;z-index:3;margin-top:-15px;padding:4px 8px;border-radius:12px;color:#fff;font-weight:600;font-size:12px;line-height:18px;letter-spacing:-.12px;white-space:nowrap;background:linear-gradient(-0.556deg,#05603A 10.094%,#027A48 23.329%,#027A48 83.868%,rgba(2,122,72,0) 109.72%);}
.ab .see{display:flex;justify-content:center;margin-top:20px}
.ab .see button{display:flex;align-items:center;padding:2px 4px 2px 12px;border:1px dashed var(--g300);border-radius:12px;font-size:12px;font-weight:500;line-height:18px;color:var(--g500)}
.ab .chev{width:22px;height:22px;display:block;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ab .chev.up{transform:rotate(180deg)}
.more-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
.ab .more-wrap.open{grid-template-rows:1fr}
.more-inner{min-height:0;overflow:hidden;margin:0 -8px;padding:0 8px}
.tiles.more{padding-top:20px;padding-bottom:6px}
.tiles.more .tile-col{opacity:0;transform:translateY(-10px) scale(.97);transition:opacity .2s ease-in,transform .25s ease-in}
.ab .more-wrap.open .tiles.more .tile-col{opacity:1;transform:none;transition:opacity .35s ease-out,transform .45s cubic-bezier(.2,.9,.3,1.15)}
.ab .more-wrap.open .tiles.more .tile-col:nth-child(1){transition-delay:.06s}
.ab .more-wrap.open .tiles.more .tile-col:nth-child(2){transition-delay:.10s}
.ab .more-wrap.open .tiles.more .tile-col:nth-child(3){transition-delay:.14s}
.ab .more-wrap.open .tiles.more .tile-col:nth-child(4){transition-delay:.18s}
.ab .more-wrap.open .tiles.more .tile-col:nth-child(5){transition-delay:.22s}
.ab .more-wrap.open .tiles.more .tile-col:nth-child(6){transition-delay:.26s}
.ab .more-wrap.open .tiles.more .tile-col:nth-child(7){transition-delay:.30s}


/* ---- payment method sheet ---- */

  background:linear-gradient(to bottom,#FBF1E2 4.211%,#fff 21.842%);box-shadow:0 -5px 10px rgba(0,0,0,.25);padding-bottom:128px;

.ab .paybtn{width:200px;border:1px solid #EF6939;border-radius:12px;background:var(--brand);padding:10px 18px;text-align:center;color:#fff;white-space:nowrap;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:transform .1s}
.ab .paybtn:active{transform:scale(.98)}
.ab .paybtn b{font-weight:600;font-size:16px;line-height:24px}
.ab .paybtn small{font-size:12px;line-height:18px;margin-left:4px}

/* ---------- LOW WALLET ---------- */
.low{background:#fff;display:flex;align-items:center;justify-content:center}
.low-in{display:flex;flex-direction:column;align-items:center;gap:32px;animation:fade .3s ease-out}
.low-art{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center}
.low-art dotlottie-wc{width:100%;height:100%}
/* the still wallet shows until the player upgrades, then gets out of the way */
.low-art img{width:124px;height:124px;border-radius:50%;object-fit:cover}
.low-art dotlottie-wc:defined ~ img{display:none}
@keyframes breathe{50%{transform:scale(1.05)}}
.low-in h2{font-weight:700;font-size:20px;line-height:30px;color:var(--g600);text-align:center}
.low-in > div{display:flex;flex-direction:column;align-items:center}
.low-in p{margin-top:8px;width:268px;font-size:16px;line-height:24px;color:var(--g700);text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- POPUP + CONFETTI ---------- */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.8);animation:fade .25s ease-out;overflow:hidden}
/* Confetti sits ABOVE the black scrim and BELOW the card — both layers are positioned, so DOM
   order alone decided it and any reorder would silently break it. Pinned explicitly. */
.confetti{position:absolute;inset:0;z-index:1;pointer-events:none}
.confetti i{position:absolute;left:50%;top:38%;width:8px;height:12px;border-radius:2px;opacity:0;animation:burst 1.5s cubic-bezier(.15,.6,.3,1) forwards}
/* holds full opacity for most of the flight — fading from frame one made the pieces read as if
   they were under the scrim rather than on top of it */
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.pop{position:absolute;left:50%;top:50%;width:278px;z-index:2;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;animation:popin .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes popin{from{transform:translate(-50%,-50%) scale(.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.pop .badge{position:relative;z-index:2;width:52px;height:52px;margin-bottom:-26px;animation:wiggle 1.2s ease-in-out .3s}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.1)}50%{transform:rotate(10deg)}75%{transform:rotate(-5deg)}}
.pop-card{width:100%;background:#fff;border-radius:16px;padding:4px 4px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.pop-title{width:100%;border-radius:12px 12px 0 0;padding:32px 12px 20px;text-align:center;font-weight:700;font-size:18px;line-height:28px;color:var(--g800);background:linear-gradient(118.9deg,#e3cffd 22.4%,#fff 81%)}
.pop-body{padding:0 12px;text-align:center;font-size:16px;line-height:28px;color:var(--g600)}
.pop-body b{font-weight:700;color:var(--g800)}
.pop-body .semi{font-weight:600}
.pop-body .g{color:#027A48}

/* ---------- CHAT ---------- */
.chat{background:#f6f4f1}
.chat-head{position:absolute;top:0;left:0;right:0;z-index:4;background:#fff;box-shadow:0 1px 0 var(--g200)}
.chat-nav{height:64px;display:flex;align-items:center;gap:10px;padding:0 16px 0 12px}
.chat-nav .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.chat-nav .back img{width:22px;height:22px}
.chat-nav h3{font-weight:700;font-size:16px;line-height:24px;color:var(--g800)}
.chat-nav .on{display:flex;align-items:center;gap:5px;font-weight:600;font-size:12px;color:#027A48}
.chat-nav .on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--s600)}
.msgs{position:absolute;top:64px;left:0;right:0;bottom:0;overflow-y:auto;padding:12px 16px 210px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.msgs::-webkit-scrollbar{display:none}
.msg{max-width:268px;padding:8px 12px;border-radius:14px;font-size:14px;line-height:22px;color:var(--g800);display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:8px}
.msg time{font-size:10px;line-height:14px;color:var(--g500);margin-left:auto}
.msg.in{background:#fff;align-self:flex-start;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.msg.out{background:#fde2d6;align-self:flex-end}
.sys{background:var(--g100);border:1px solid var(--g300);border-radius:10px;padding:8px 12px;text-align:center;font-size:14px;line-height:22px;color:var(--g600)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;border-radius:16px 16px 0 0;padding:0 4px;background:linear-gradient(#7d58a1,#4a3460);display:flex;flex-direction:column;align-items:center;animation:sheetup .45s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.sheet-top{display:flex;gap:6px;align-items:center;justify-content:center;padding:6px 0 11px;color:#fff;font-weight:700;font-size:14px}
.sheet-top img{width:19px;height:23px;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.8) rotate(12deg);opacity:.75}}
.sheet-card{width:100%;margin-top:-3px;background:#fff;border-radius:24px 26px 0 0;padding:16px 16px 20px;display:flex;flex-direction:column;gap:12px}
.sheet-row{display:flex;gap:12px;align-items:center;font-size:16px;line-height:24px;color:var(--g800)}
.sheet-row b{font-weight:600;color:var(--s700)}
.sheet-card > button{background:var(--brand);border:1px solid var(--brand);border-radius:12px;padding:8px 16px;text-align:center;color:#fff;font-weight:600;font-size:16px;line-height:24px;box-shadow:0 1px 3px rgba(16,24,40,.1),0 1px 2px rgba(16,24,40,.06)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:reduce){.swap .lp{display:none}}

/* ================= Add Money (from pricing-v2), scoped to .am ================= */

/* ---------- header ---------- */
.am .nav{position:absolute;left:0;right:0;top:0;border-bottom:1px solid #D0D5DD;background:#fff;z-index:5}
.am .topnav{height:64px;display:flex;align-items:center;padding:8px 16px}
.am .topnav .ttl{flex:1;display:flex;align-items:center;gap:2px}
.am .topnav .back{width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:4px}
.am .topnav h1{font-size:18px;font-weight:600;line-height:28px;color:#344054}
.am .badge{display:flex;align-items:center;gap:8px;background:#F2F4F7;border-radius:20px;padding:4px 8px}
.am .badge p{font-size:12px;font-weight:600;line-height:18px;color:#475467}

.am .chev{width:22px;height:22px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.am .chev.up{transform:rotate(180deg)}
/* clip, not hidden: several layers here rest below the fold on a transform (the closed
   .openwrap at +14px, the closed pay sheet at +100%) and a transform still counts as
   scrollable overflow. overflow:hidden leaves the screen scrollable, so focusing a control
   near the bottom scrolls the whole phone off its own frame; overflow:clip cannot scroll. */
/* Opaque: mount() slides this screen in ON TOP of the one it came from, so without a background
   the home screen shows straight through it for the whole 340ms. */
.screen.am{overflow:clip;background:#fff}

/* ---------- offer band ---------- */
/* Light green fading out to WHITE ON THE RIGHT, dark green text. (Earlier passes were solid
   #039855/#027A48 with white text; before that a v2 fade downward. This is the third and current
   shape.) The fade runs left-to-right, so it never touches the text's left edge and the last word
   still lands on a pale background — which is why the copy has to stay short enough not to reach
   the white end. Keeps v1's timer rule: a countdown shows a stronger green, no countdown a softer
   one, keyed on the TIMER and not the mode (see renderBand). */
/* Lightened from #E2FBEE (Sep 21). Only the UNTIMED green moves — .bn-dark below is the
   countdown variant and stays put, since the whole point of that pair is that a running timer
   reads stronger than a static message. Each stop is pulled the same fraction of the way to
   white, so the ramp keeps its shape and still clears the copy before the white end. */
.am .banner,.am .band3{color:#05603A;background:linear-gradient(90deg,#E9FCF2 0%,#F0FDF6 40%,#F8FEFB 78%,#fff 100%);border-radius:32px 32px 0 0;transition:background .3s,transform .42s cubic-bezier(.2,.8,.2,1),margin-bottom .42s cubic-bezier(.2,.8,.2,1)}
.am .banner.bn-dark,.am .band3.bn-dark{background:linear-gradient(90deg,#CDF8E0 0%,#DEFBEB 40%,#F2FDF8 78%,#fff 100%)}
/* The tops below are measured from the nav's real height (64px + 1px border = 65px).
   Change anything in .nav and all four must move with it. */
/* flush with the receipt card below it, which sits at 16px either side */
/* 16px below the 64px nav — her spacing. The receipt card's top MUST move with this by the same
   amount, or the strip of band left showing above the card changes width (it is card.top minus
   this, and is meant to stay 62). */
.am .banner{position:absolute;top:80px;left:16px;right:16px;z-index:1}
/* Wallet flow only: the band is the ₹50 nudge and nothing else, so it is parked behind the SKU
   card and slides up only while ₹50 is selected. 62px is not a taste value — it is exactly the
   strip of band that shows above the card (card top 142 − band top 80), so translating by it
   leaves the band's top edge level with the card's and the whole thing hidden. If either top
   moves, this moves with it. The card is z-index 2 with an opaque #fff fill, which is what makes
   the band disappear behind it rather than under it. */
.am .banner.bn-off{transform:translateY(62px)}
/* The band sits BEHIND the receipt card, not above it: 62px of it shows (151 − 89) and the
   rest is hidden. So the bottom padding is deliberate filler, not spacing — it has to outrun
   that 62px or a gap opens up. Top/side padding is what actually sizes the visible strip.
   Square bottom corners for the same reason: the card covers them.
   The icon sits on the vertical centre of the two text lines, not on the first one. */
.am .bandin{position:relative;display:flex;gap:10px;align-items:center;padding:12px 16px 42px}
.am .bandin img{width:26px;height:26px;flex-shrink:0;transition:filter .3s}
/* the discount tag tips side to side every few seconds so the offer keeps a bit of life */
.am .bandin .tag{transform-origin:50% 50%;animation:tagWiggle 3.4s ease-in-out infinite}
@keyframes tagWiggle{
  0%,62%,100%{transform:rotate(0)}
  68%{transform:rotate(-13deg) scale(1.08)}
  74%{transform:rotate(10deg) scale(1.08)}
  80%{transform:rotate(-7deg) scale(1.04)}
  86%{transform:rotate(4deg)}
  92%{transform:rotate(-2deg)}}
/* ONE type size across every band variant — her call. They had drifted to 11.5 / 13 / 15px
   depending on which flow you were in, which read as five different components. 12/16 is now
   the size for all of them and WEIGHT is the only thing that carries emphasis: the figures
   (₹ amounts, rates, the countdown) sit at 800 against 400-600 copy.
   Anything added here must NOT reintroduce a font-size. */
.am .bandin .l1,.am .bandin .l2,.am .bandin .rate{font-size:12px;line-height:16px}
.am .bandin .l1{font-weight:600;letter-spacing:.1px}
.am .bandin .l1 b{font-weight:800;font-variant-numeric:tabular-nums}
/* Wallet flow only: regular copy with the figure as the single bold thing on the line. */
.am .bandin .l1.reg{font-weight:400}
.am .bandin .l2{margin-top:1px;font-weight:500;color:#027A48}
/* Astrologer flow, tile too small to connect: same left-to-right fade, red. */
.am .banner.red,.am .band3.red{color:#912018;background:linear-gradient(90deg,#FCE7E7 0%,#FDEEEE 40%,#FEF8F8 78%,#fff 100%)}
.am .red .bandin .l1,.am .red .bandin .l2{color:#912018}
/* Continue-chat flow (View History → Continue Chat): the first-5-minutes promo. The ONLY band
   that is solid green with white text — every other one is a pale wash with dark text. The fade
   still runs rightward and the copy must clear the white end, so keep this line short. */
/* The ramp starts AFTER the copy ends (measured: the rate line runs to 86% of a 342px band), so
   no word ever sits on the wash. An earlier 70% start put "(80% off)" on pale green and the band
   read as damaged — the white end also swallowed its own rounded corner. Re-measure
   `.rate`'s right edge against the band if this copy ever changes. */
/* NAMED bn-promo, not promo: `.promo` is already v1's purple home-screen carousel card, which is
   unscoped and sets height:60px + overflow:hidden. Naming this variant `.promo` silently clamped
   the band to 60px so it stopped reaching under the receipt card. Any new band class has to be
   checked against the v1 CSS above before it is used. */
/* Seven stops, not four: three stops crammed into the last 12% banded visibly. The first two
   steps are near-identical to #039855, so the copy (which ends at ~86%) still sits on what reads
   as solid green — the "no word may sit on the gradient" rule is kept while the ramp gets longer
   and therefore smoother. */
.am .banner.bn-promo,.am .band3.bn-promo{color:#fff;background:linear-gradient(90deg,#039855 0%,#039855 80%,#0BA05C 86%,#3CB783 90%,#7CD0AC 94%,#BCE8D5 97%,#E9F9F2 99%,#fff 100%)}
.am .bn-promo .bandin .l1{color:#fff;font-weight:600}
.am .bn-promo .bandin .rate,.am .bn-promo .bandin .rate b{color:#fff}
.am .bn-promo .bandin .rate s{opacity:.8}
.am .bn-promo .bandin .rate .off{margin-left:6px}
/* she asked for the tag to tick over faster on this flow only */
.am .bn-promo .bandin .tag{animation-duration:1.5s}
/* Chat Again → ASTRO50. Deepest green of the set, carrying v1's sparkle field AND v1's light
   sweep, with the countdown running. Identical on every tile. The stars and the sweep are
   SIBLINGS of .bandin, not children, so they inherit the band's own 32px corners; .bandin is
   lifted above them (everything here is positioned, so DOM order alone would put them on top). */
.am .banner.coupon,.am .band3.coupon{color:#fff;background:linear-gradient(90deg,#065F41 0%,#066B44 88%,#3FA87A 94%,#AFE0CA 97.5%,#fff 100%)}
.am .coupon .bandin{z-index:1}
.am .coupon .bandin .l1,.am .coupon .bandin .l2{color:#fff}
.am .coupon .bandin .l2{font-weight:600}
.am .coupon .bandin .l2 b{font-weight:800;letter-spacing:.3px;font-variant-numeric:tabular-nums}
/* v1's exact treatment: anchored to the RIGHT, small (236px of a 342px band, not full-bleed),
   masked out towards the text so it never crowds the copy. Stretching it full-width was the
   version she called "horrible".
   OPACITY DIRECTION — the thing that kept going wrong: stars.svg is 45 solid #FFFFFF shapes on a
   DARK GREEN band, so opacity is a straight visibility dial. UP = brighter, more visible.
   DOWN = the white fades into the green and they vanish. There is no value that is both fainter
   and more visible; if the ask is "more visible", this number must RISE. */
.am .coupon .bn-stars{position:absolute;right:0;top:0;width:236px;height:44px;z-index:0;object-fit:cover;object-position:right top;pointer-events:none;opacity:.2;
  -webkit-mask-image:linear-gradient(to left,#000 0%,rgba(0,0,0,.5) 26%,rgba(0,0,0,.12) 52%,transparent 72%);mask-image:linear-gradient(to left,#000 0%,rgba(0,0,0,.5) 26%,rgba(0,0,0,.12) 52%,transparent 72%)}
.am .coupon .sweep{z-index:0;height:62px;bottom:auto}
/* Astrologer flow, tile big enough: the rate the recharge buys, with the list price struck out.
   Both sit on ONE line, so this variant has no .l2 — the band is a single-line strip. */
.am .bandin .rate{margin-top:1px;font-weight:500;color:#027A48}
.am .bandin .rate b{font-weight:800;font-variant-numeric:tabular-nums;color:#05603A}
.am .bandin .rate s{margin-left:6px;opacity:.65;font-weight:600}
/* The arrows drift down the right-hand end, behind the text, to sell "the rate falls".
   Clipped to the 62px that actually shows (see .bandin) so they never leak out behind the card;
   they are decoration only, hence aria-hidden in the markup and no pointer events here. */
.am .bandin .arrows{position:absolute;right:0;top:0;width:96px;height:62px;overflow:hidden;pointer-events:none}
/* ONE pass, not a loop — her call. `both` holds the last frame, which is opacity:0, so they fall
   once and stay gone. renderBand() rewrites the band's innerHTML on every tile tap, so the
   animation restarts by itself on each SKU pick; nothing has to retrigger it. */
.am .bandin .arrows img{position:absolute;width:24px;height:32px;opacity:0;animation:arrowDrift 1.15s cubic-bezier(.3,0,.5,1) both}
/* SCATTERED, not one line — Sep 21, she reversed the earlier "one line" call with a reference
   image: three arrows sitting high-left, low-middle, mid-right.
   The staggered attempt that was rejected before (tops -34/-12/-20, delays 0/.10/.05) failed
   because it staggered the DELAYS too, which pulled the three apart in flight until there was no
   shape left to read. The delay stays identical for all three here, so the constellation is rigid
   and the whole cluster falls as one piece — only the start offsets and a few degrees of tilt
   differ. Do not reintroduce per-arrow delays; the offsets alone already make them enter in a
   cascade, because each one clears the strip's top edge at a different moment.
   Spans 14-94px inside the 96px container and starts wholly above it (lowest top is -18, arrows
   are 32 tall), so nothing pops in at the edge.
   NO per-arrow rotation: a -9/+5/-4deg spread was tried and read as crooked rather than scattered,
   because the asset already carries its own diagonal and tilting it further just looks misaligned.
   The offsets alone do the scattering. Keep all three upright. */
.am .bandin .arrows img{animation-delay:0s}
.am .bandin .arrows img:nth-child(1){right:58px;top:-46px}
.am .bandin .arrows img:nth-child(2){right:30px;top:-18px}
.am .bandin .arrows img:nth-child(3){right:2px;top:-34px}
/* starts above the strip and leaves below it, so the fade in/out never shows a hard edge */
@keyframes arrowDrift{
  0%{transform:translateY(0);opacity:0}
  22%{opacity:.85}
  60%{opacity:.85}
  100%{transform:translateY(104px);opacity:0}}
/* Lightened from #FEF0C7 (Sep 21). Its luminance already matched the green band's #E2FBEE almost
   exactly — what made it read as the heavier of the two was CHROMA: #FEF0C7 spans 55 between its
   max and min channel against the green's 25. So the blue channel is lifted and the other two are
   left alone, which drops the spread to 32 without touching how light it is. Keep that in mind
   before "lightening" this further by raising all three channels — that washes it out instead. */
.am .banner.gold,.am .band3.gold{background:#FEF5DE}
/* Wallet flow only: the gold strip fades out to white, rightward, matching the green band. */
.am .banner.gold.gfade,.am .band3.gold.gfade{background:linear-gradient(90deg,#FEF5DE 0%,#FEF8E9 40%,#FFFCF6 78%,#fff 100%)}
.am .gold .bandin .l1{color:#93370D;font-weight:700}
.am .gold .bandin .l2{color:#B54708}
.am .gold .bandin img{filter:hue-rotate(255deg) saturate(1.2)}

/* ---------- collapsed receipt ---------- */
.am .collapsed{position:absolute;inset:0;transition:opacity .3s cubic-bezier(.2,.8,.2,1),transform .36s cubic-bezier(.2,.8,.2,1)}
/* The outline is drawn, not a border. An elliptical border-radius was the only way to bow
   the bottom in CSS, but its radius of curvature where it meets the vertical side works out
   at ry²/rx — about 3px here — which is the pinch that read as a sharp corner. The path in
   drawRcpt() leaves the side vertically and eases into the bow, so the curvature is spread
   out the way the green arc under the congratulations card is. */
.am .rcpt{position:absolute;left:16px;right:16px;top:142px;height:229px;z-index:2;transition:top .42s cubic-bezier(.2,.8,.2,1)}
/* Wallet flow with the nudge band hidden: the card takes the band's place instead of leaving a
   hole under the nav. 80px is the band's own top, so the card ends up exactly where the band
   started and the 15px breathing room below the nav is preserved.
   This has to move in step with .banner.bn-off, and the two are deliberately the same duration
   and curve: the band travels +62 while the card travels −62, so they close on each other and
   meet halfway. That is what makes it read as the card rising and swallowing the band, rather
   than two separate things moving. The band stays covered throughout — past the halfway point
   the card's top is above the band's, and the card is z-index 2 over the band's 1. */
.am.bandoff .rcpt,.am.bandoff .stack{top:80px}
.am .rcptline{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
/* Was 3/2, which is exactly what Chrome draws for `1px dashed`; she asked for shorter dashes,
   so the path is now 2/2. The notch below is still a real CSS dashed border and so is still
   Chrome's 3/2 — CSS gives no way to set a dash length. It is a 20px half-circle butted into
   the card edge, and at 1px the difference over that arc is not resolvable; replacing it with
   a masked gradient ring loses the white fill that punches the bite out of the card. */
.am #rcptPath{fill:#fff;stroke:#C6CCD5;stroke-width:1;stroke-dasharray:2 2;stroke-linecap:butt}
.am .notch{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:1px dashed #D0D5DD}
.am .notch.l{left:-11px;clip-path:inset(0 0 0 50%)}
.am .notch.r{right:-11px;clip-path:inset(0 50% 0 0)}
/* Sits 28px below the bonus chips (120.5), which is the same inset the tiles get from the top
   edge — that symmetry is what the card's height is sized around. Must stay above the point
   the bottom arch starts (height - DROP = 173). */
.am .rcpt .notch{top:148px}
/* same box as the receipt card, so "See More Options" can hang off its bottom edge */
.am .stack{position:absolute;left:32px;right:32px;top:142px;height:229px;z-index:3;transition:top .42s cubic-bezier(.2,.8,.2,1)}
.am .skus{position:absolute;left:0;right:0;top:28px;height:96px;display:flex;gap:12px;align-items:flex-start}
/* Anchored from the top, not the bottom, so growing the card or deepening the arch below it
   leaves the button exactly where it is.
   The two gaps are what she tunes, so keep them derivable: the SKU block ends at 124, so this
   top IS 124 + gap. Sep 21 she took 8 off each — gap below the SKUs 59 -> 51 (top 183 -> 175)
   and gap below the button 31 -> 23, the latter by shortening the card 245 -> 229. Changing
   .see's top alone moves BOTH gaps, so the card height has to move with it. */
.am .see{position:absolute;left:0;right:0;top:175px;display:flex;justify-content:center}
.am .seebtn{display:flex;align-items:center;border:.8px dashed #D0D5DD;border-radius:12px;padding:4px 4px 4px 12px}
.am .seebtn p{font-size:12px;line-height:18px;color:#667085;white-space:nowrap}

/* ---------- amount tile ---------- */
.am .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.am .opt{position:relative;width:100%;cursor:pointer}
.am .box{position:relative;width:100%;aspect-ratio:1/0.81;background:#fff;border:1px solid #D0D5DD;border-radius:14px;
  box-shadow:0 4px 8px rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;overflow:hidden;
  transition:border-color .2s,box-shadow .2s,transform .12s}
.am .opt:active .box{transform:scale(.97)}
.am .box.on{border:1.5px solid #EF6939;box-shadow:0 6px 14px rgba(239,105,57,.14)}
.am .sku{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:center;color:#344054}
.am .sku .r{font-size:12px;font-weight:700;line-height:21px;height:18px;width:6px}
.am .sku .n{font-size:20px;font-weight:600;line-height:26px;white-space:nowrap}
.am .corner{position:absolute;top:0;right:0;width:38px;height:38px;overflow:hidden;border-top-right-radius:13px;line-height:0;
  animation:cornerIn .28s cubic-bezier(.2,.9,.3,1.2)}
.am .corner svg .tick{transform-origin:25.8px 13.2px;animation:tickIn .35s .08s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes cornerIn{from{transform:translate(8px,-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes tickIn{from{transform:rotate(-90deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
/* max-width caps the pill at the tile it hangs off, so a long bonus ellipsises instead of
   spilling past the SKU. Vertical padding holds the pill at its old 26px height so the
   spacing below it — and therefore the card height — is unaffected by the smaller type. */
.am .chip{position:relative;z-index:4;margin-top:-11px;max-width:100%;display:flex;align-items:center;justify-content:center;padding:6px 8px;border-radius:12px;
  background:linear-gradient(-0.5deg,#027A48 10.094%,#039855 23.329%,#039855 83.868%,rgba(3,152,85,0) 109.72%)}
.am .chip p{position:relative;z-index:1;font-size:10px;font-weight:600;line-height:14px;letter-spacing:-.1px;color:#fff;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* The figure carries the hierarchy; "more" and the ₹ stay at 10px/600. line-height is pinned
   so the bigger inline type can't grow the line box and push the pill taller — the card's
   spacing below is measured off this pill's height. */
.am .chip p b,.am .flyer p b{font-size:12px;font-weight:800;line-height:14px}
/* Light sweep, collapsed row only — nine of these at once in the open grid reads as noise.
   Clipped by the pill's own overflow, and sits under the text via .chip p's z-index. */
.am #skus .chip{overflow:hidden}
.am #skus .chip::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.4) 50%,rgba(255,255,255,0));
  animation:chipSweep 3.2s linear infinite;animation-delay:var(--sd,0s)}
@keyframes chipSweep{0%{transform:translateX(-120%)}42%,100%{transform:translateX(300%)}}
/* Two reasons to stand the sweep down, and in both cases it is dropped outright rather than
   paused — a paused sweep freezes mid-pill as a visible pale streak.
   1. `.timed`: a live countdown is on the band, and that is the one thing that should be moving.
   2. `.lure`: the sweep is bait for a bonus you are NOT taking, so it only runs while the selected
      amount earns nothing — ₹50 on every flow that has a zero-bonus tile. Pick ₹100 or more and
      the badges go still; you have already taken the bonus, so there is nothing left to point at.
   (2) happens to subsume (1) today, since renderBand can never set both at once. Both are kept
   because they are separate decisions of hers and the flags they read are independent. */
.am.timed #skus .chip::after,.am:not(.lure) #skus .chip::after{display:none}

/* Coin shower — a dotLottie drawn onto one canvas, created once in initCoins() and re-parented
   into whichever ₹250 tile is on screen.
   NO mask here, deliberately: v1's edge mask cannot come along. iOS rasterises a masked
   overflow:hidden layer once and never repaints it, which merely stuttered the old CSS coins
   but would freeze a canvas on frame one.
   The layer stops 11px short of the card's bottom edge, which is exactly where the badge
   starts (.chip's margin-top:-11px). Coins therefore never reach the badge's band, and
   z-index 0 keeps them behind it in the 8px the card is wider than the pill. */
.am .coinfall{position:absolute;left:0;right:0;top:0;bottom:11px;border-radius:14px;overflow:hidden;pointer-events:none;z-index:0;opacity:1;transition:opacity .2s ease}
.am .box.on .coinfall{opacity:0}
.am .coinfall canvas{display:block;width:100%;height:100%}

/* ---------- open list ---------- */
/* Collapsed and expanded are two stacked layers. They cross-dissolve, but each also
   moves a little in the direction of travel so the swap reads as one motion. */
.am .openwrap{position:absolute;left:0;right:0;top:65px;bottom:0;z-index:1;visibility:hidden;opacity:0;transform:translateY(14px);
  transition:opacity .3s cubic-bezier(.2,.8,.2,1),transform .36s cubic-bezier(.2,.8,.2,1),visibility 0s .36s}
.screen.am.open .openwrap{visibility:visible;opacity:1;transform:none;
  transition:opacity .3s cubic-bezier(.2,.8,.2,1),transform .36s cubic-bezier(.2,.8,.2,1)}
.screen.am.open .collapsed{opacity:0;transform:translateY(-10px) scale(.985);pointer-events:none}
/* staggered reveal, gated to the open/close transition so re-rendering tiles on every
   tap cannot replay it */
@keyframes gridIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.screen.am.open.switching .grid .col{animation:gridIn .34s cubic-bezier(.2,.9,.3,1) both}
.screen.am.open.switching .grid .col:nth-child(n+4){animation-delay:.05s}
.screen.am.open.switching .grid .col:nth-child(n+7){animation-delay:.1s}
.screen.am.open.switching .grid .col:nth-child(n+10){animation-delay:.15s}
.am .openscroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:10px 16px 0}
.am .openscroll::-webkit-scrollbar{display:none}
.am .band3{position:relative;z-index:1;margin:0 4px}
/* Same slide inside the open "See More Options" sheet, where the band is in normal flow instead of
   absolutely placed, so it has to close the space it leaves as well as move out of it.
   57 = the band's 87px height minus the 30px .rc already overlaps it by, i.e. the strip actually
   on show here. The gap is closed on .rc's OWN margin-top rather than a margin-bottom on the band:
   adjacent siblings collapse their margins to the single most-negative value, not the sum, so a
   -57 here and .rc's standing -30 would have given -57 and left 30px of empty sheet behind.
   -87 takes .rc's top all the way up to where the band's box starts, and .rc is z-index 2 with an
   opaque background, so the band ends up entirely inside it. */
.am .band3.bn-off{transform:translateY(57px)}
.am .band3.bn-off + .rc{margin-top:-87px}
/* pulled up over the band's filler padding, the same way .rcpt covers it in the closed state */
.am .rc{position:relative;z-index:2;background:#fff;border:1px dashed #D0D5DD;border-radius:24px;margin-top:-30px;padding:18px 16px;transition:margin-top .42s cubic-bezier(.2,.8,.2,1)}
.am .rc .notch{bottom:58px}
.am .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.am .seerow{display:flex;justify-content:center;margin-top:30px}
.am .scrollpad{height:0}
/* scroll indicator */
.am .sbar{position:absolute;right:5px;top:14px;width:3px;border-radius:3px;background:rgba(16,24,40,.07);z-index:4;opacity:0;transition:opacity .35s}
.am .sbar.on{opacity:1}
.am .sbar i{position:absolute;left:0;top:0;width:3px;border-radius:3px;background:rgba(16,24,40,.34)}

/* ---------- bottom block ---------- */
.am .payblock{position:absolute;left:0;right:0;bottom:0;z-index:3}
.am .cardwrap{position:relative;display:flex;flex-direction:column;align-items:center;perspective:900px}
.am .cardwrap>.ac{margin-bottom:-22px;z-index:1}
.am .arc{position:relative;z-index:2;display:block;width:100%;height:24px}
.am .arc #arcLine{transition:opacity .3s}
.am .payblock.gold #arcLine{opacity:0}
/* overlay that fades the amounts behind the card; it ends exactly at Payment Summary.
   It also BLURS them — .payblock is z-index 3, above both the collapsed tiles and the open grid,
   so backdrop-filter here picks them up. The mask is what makes it usable: a backdrop-filter
   applies at full strength right to the element's top edge, which would draw a hard blur seam
   across the tiles, so the mask ramps the blur in over the same stretch the tint ramps over.
   (The mask fades the tint too, but the tint is near-transparent up there anyway.)
   The ramp carries intermediate stops rather than going straight transparent->black: a plain
   two-stop ramp still reads as a visible band where it starts. Keep the radius low — a big
   radius makes the ramp itself obvious no matter how long it is. */
.am .veilfade{position:absolute;left:0;right:0;bottom:0;height:250px;z-index:0;pointer-events:none;opacity:0;transition:opacity .3s;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,rgba(0,0,0,.14) 26%,rgba(0,0,0,.45) 48%,rgba(0,0,0,.8) 68%,#000 84%);
  mask-image:linear-gradient(180deg,transparent 0,rgba(0,0,0,.14) 26%,rgba(0,0,0,.45) 48%,rgba(0,0,0,.8) 68%,#000 84%);
  background:linear-gradient(180deg,rgba(236,253,243,0) 0%,rgba(230,250,239,.30) 34%,rgba(214,244,229,.72) 66%,rgba(201,239,220,.94) 86%,#C6EEDB 100%)}
.am .payblock.gold .veilfade{background:linear-gradient(180deg,rgba(251,246,234,0) 0%,rgba(250,243,228,.34) 34%,rgba(246,236,210,.74) 66%,rgba(242,230,200,.94) 86%,#F1E4C4 100%)}
.screen.am.open .veilfade,.screen.am.sumopen .veilfade{opacity:1}
.screen.am.sumopen .veilfade{height:420px}

/* wallet card (B3) */
/* square along the bottom so the card sits flush on the sheet below it */
.am .ac{position:relative;width:268px;height:108px;border-radius:18px 18px 0 0;padding:1.5px;display:flex;align-items:center;justify-content:center;isolation:isolate;
  box-shadow:0 6px 14px rgba(4,60,38,.16);transition:background .35s,box-shadow .35s}
.am .ac.green{background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(2,122,72,.45) 48%,rgba(255,255,255,.85))}
.am .ac.gold{background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(150,110,25,.42) 48%,rgba(255,255,255,.88));box-shadow:0 6px 14px rgba(80,58,10,.14)}
.am .ac .skin{position:absolute;inset:1.5px;border-radius:16.5px 16.5px 0 0;overflow:hidden;z-index:0}
.am .ac.green .skin{background:radial-gradient(60% 90% at 50% 56%,rgba(255,255,255,.62),rgba(255,255,255,0) 60%),
  conic-gradient(from 190deg at 50% 56%,#CDEEDE,#86D3B2 30deg,#E6F8EF 60deg,#8AD4B4 96deg,#D9F3E8 132deg,#7FCDAC 168deg,#E6F8EF 204deg,#84D1B0 244deg,#D2F0E2 288deg,#8FD7B7 324deg,#CDEEDE 360deg)}
.am .ac.gold .skin{background:radial-gradient(60% 90% at 50% 56%,rgba(255,255,255,.68),rgba(255,255,255,0) 60%),
  conic-gradient(from 190deg at 50% 56%,#F3E8CC,#DEC88F 30deg,#FBF4E4 60deg,#E2CE99 96deg,#F7EEDA 132deg,#D8C085 168deg,#FBF4E4 204deg,#E0CB94 244deg,#F4EBD3 288deg,#E6D3A2 324deg,#F3E8CC 360deg)}
.am .ac .spin{position:absolute;left:50%;top:56%;width:520px;height:520px;transform:translate(-50%,-50%);opacity:.085;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.9) 0deg .5deg,rgba(255,255,255,0) .5deg 1.7deg),
             repeating-conic-gradient(from 0deg,rgba(0,70,44,.6) 0deg .3deg,rgba(0,70,44,0) .3deg 1.7deg)}
.am .ac.gold .spin{background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.9) 0deg .5deg,rgba(255,255,255,0) .5deg 1.7deg),
             repeating-conic-gradient(from 0deg,rgba(96,70,10,.55) 0deg .3deg,rgba(96,70,10,0) .3deg 1.7deg)}
/* picking an amount tips the card in Z and settles it back */
.am .ac.tilt{animation:cardTilt .62s cubic-bezier(.22,.9,.28,1)}
@keyframes cardTilt{
  0%{transform:none}
  30%{transform:rotateX(9deg) rotateY(-6deg) scale(1.03)}
  62%{transform:rotateX(-3.5deg) rotateY(2.5deg) scale(1.006)}
  100%{transform:none}}
.am .ac .c{position:relative;z-index:2;text-align:center;padding:2px 18px 0}
.am .ac .e{font-size:11.5px;font-weight:700;letter-spacing:.7px}
.am .ac.green .e{color:#05603A}
.am .ac.gold .e{color:#8A6A24}
.am .ac .amt{position:relative;width:fit-content;margin:8px auto 0;display:flex;align-items:flex-start;justify-content:center;gap:3px}
/* the tile's "+₹50" chip lifts off, arcs down and drops into the card; the bonus starts
   counting on at the moment it lands. Built in JS so it can measure both ends. */
.am .flyer{position:absolute;z-index:8;pointer-events:none;display:flex;align-items:center;justify-content:center;
  border-radius:12px;box-shadow:0 10px 20px rgba(4,60,38,.32);will-change:transform,opacity;
  background:linear-gradient(-0.5deg,#027A48 10%,#039855 23%,#039855 84%,#04A85D 110%)}
.am .flyer p{font-size:10px;font-weight:600;line-height:14px;letter-spacing:-.1px;color:#fff;white-space:nowrap}
/* the amount takes the hit as the chip lands */
.am .ac .amt.absorb{animation:absorb .52s cubic-bezier(.24,1.6,.36,1)}
@keyframes absorb{0%{transform:none}24%{transform:scale(1.14)}58%{transform:scale(.975)}100%{transform:none}}
.am .ac.green .amt{color:#04301F}
.am .ac.gold .amt{color:#3F3417}
.am .ac .amt .r{font-size:17px;font-weight:700;line-height:1}
.am .ac .amt .n{font-size:31px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.am .ac .t{margin-top:8px;font-size:12.5px;font-weight:500;color:#1D2939}

/* payment summary (original expanded content) */
/* 16px gutter so "Payment Summary" starts on the same edge as "Pay with", the receipt
   card and the Pay button */
.am .summary{position:relative;z-index:2;background:#fff;padding:0 16px}
.am .sumrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 14px}
.am .sumrow .sl{font-size:13.5px;line-height:18px;color:#667085;white-space:nowrap}
.am .sumrow .sr{display:flex;align-items:center;gap:4px;font-size:13.5px;line-height:18px;color:#667085;white-space:nowrap}
.am .ps-details{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.screen.am.sumopen .ps-details{grid-template-rows:1fr}
.am .ps-inner{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:20px;opacity:0;transition:opacity .2s ease}
.screen.am.sumopen .ps-inner{opacity:1;transition:opacity .3s ease .1s;padding-bottom:6px}
.am .ps-sec{display:flex;flex-direction:column;gap:12px}
.am .ps-dash{display:block;height:1px;background:repeating-linear-gradient(90deg,var(--dc) 0 2px,transparent 2px 4px)}
.am .ps-calc{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.am .ps-line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.am .ps-line span:first-child{font-size:12px;line-height:18px;color:#667085}
.am .ps-line span:last-child{font-size:14px;line-height:20px}
.am .ps-line.r1 span:last-child{color:#344054}
.am .ps-line.r2 span:last-child{color:#1D2939}
.am .ps-line.tot{padding:0 12px}
.am .ps-line.tot span{font-size:14px!important;line-height:20px;font-weight:600;color:#1D2939!important}
.am .ps-credit{display:flex;flex-direction:column}
.am .ps-box{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #027A48;border-radius:12px;padding:8px 12px;color:#027A48}
.am .ps-box span{font-size:12px;line-height:18px;font-weight:600}
.am .ps-box b{font-size:14px;line-height:24px;font-weight:700}
.am .ps-box.plain{border-color:#D0D5DD;color:#475467}
.am .ps-panel{margin:-12px 0 0;padding:24px 12px 12px;border-radius:0 0 12px 12px;background:#F2F4F7;display:flex;flex-direction:column;gap:8px}
.am .ps-line.p1 span:last-child{color:#1D2939}
.am .ps-line.pg span{color:#027A48!important}
.am .ps-line.pt span:first-child{color:#475467}
.am .ps-line.pt span:last-child{color:#344054}

/* pay row */
.am .cta{position:relative;z-index:2;background:#fff;display:flex;align-items:center;gap:16px;padding:8px 16px 24px}
.am .payw{flex:1;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
/* "Pay with" is 12px and "Payment Summary" 13.5px, so their P's carry different side
   bearings (.75px vs 1px) even though both boxes start at 16. Nudge the smaller one over so
   the two P stems land on the same vertical, which is what the eye actually tracks. */
.am .payw .l{display:flex;align-items:center;font-size:12px;line-height:18px;color:#475467;margin-left:.25px}
/* The logo is a full-bleed circle so its edge sits flush at 0, while the "P" of "Pay with"
   above carries ~1px of side bearing. Nudge the row over so the two line up optically. */
.am .pp{display:flex;gap:4px;align-items:center;font-weight:700;font-size:16px;color:#344054;margin-left:1px}
.am .pp .logo{width:20px;height:20px;border:.6px solid #D0D5DD;border-radius:4px;padding:1px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.am .pp .logo img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.am .pp .logo.raw{border:0;padding:0}
.am .paybtn{width:200px;background:#EF6939;border-radius:12px;padding:12px 18px;text-align:center;color:#fff;white-space:nowrap;
  box-shadow:0 2px 6px rgba(239,105,57,.28);transition:transform .1s}
.am .paybtn:active{transform:scale(.98)}
.am .paybtn b{font-size:16px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}
.am .paybtn small{font-size:12px;line-height:18px;opacity:.95}

/* ---------- payment method sheet ---------- */
/* overflow:hidden is load-bearing: the closed sheet and CTA sit below the fold on a transform,
   which still counts as scrollable overflow. Without this the screen gains 712px of scroll
   height and focusing the summary button scrolls the whole phone off its own frame. */
.am .pm-overlay{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.am .pm-overlay.open{pointer-events:auto}
.am .pm-scrim{position:absolute;inset:0;background:rgba(16,24,40,.55);opacity:0;transition:opacity .3s ease}
.am .pm-overlay.open .pm-scrim{opacity:1}
.am .pm-sheet{position:absolute;left:0;right:0;bottom:0;height:min(732px,calc(100% - 68px));border-radius:32px 32px 0 0;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;
  background:linear-gradient(to bottom,#FBF1E2 4.211%,#fff 21.842%);box-shadow:0 -5px 10px rgba(0,0,0,.25);padding-bottom:128px;
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.am .pm-sheet::-webkit-scrollbar{display:none}
.am .pm-overlay.open .pm-sheet{transform:none}
.am .pm-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:32px;padding:24px 16px 12px;background:#FCF4E9;border-radius:32px 32px 0 0}
.am .pm-head p{flex:1;font-size:16px;font-weight:700;color:#344054}
.am .pm-x{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.am .pm-x img{width:16px;height:16px}
.am .pm-body{display:flex;flex-direction:column;gap:32px;padding:8px 16px 0}
.am .pm-group{display:flex;flex-direction:column;gap:8px}
.am .pm-gt{font-size:14px;font-weight:500;color:#344054}
.am .pm-card{background:#fff;border:1px solid #EAECF0;border-radius:18px;padding:12px;display:flex;flex-direction:column}
.am .pm-list{gap:16px}
.am .pm-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%}
.am .pm-name{display:flex;align-items:center;gap:10px;font-size:14px;line-height:20px;font-weight:500;color:#475467}
.am .pm-logo{width:32px;height:32px;padding:2px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid #D0D5DD;flex-shrink:0;background:#fff;overflow:hidden}
.am .pm-logo img{width:100%;height:100%;object-fit:cover}
.am .pm-logo.raw{border:0;padding:0}
.am .pm-radio{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:100px}
.am .pm-radio img{width:20px;height:20px}
.am .pm-row:active .pm-radio{background:rgba(239,105,57,.08)}
.am .pm-div{display:block;height:1px;background:repeating-linear-gradient(90deg,#EAECF0 0 2px,transparent 2px 4px)}
.am .pm-cta{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border:1px solid #D0D5DD;border-bottom:0;border-radius:12px 12px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.2);
  transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.9,.3,1) .04s}
.am .pm-overlay.open .pm-cta{transform:none}
.am .pm-credit{padding:12px 12px 8px;text-align:center;font-size:14px;line-height:20px;color:#344054}
.am .pm-credit .g{font-weight:700;color:#027A48}
.am .pm-credit .w{color:#475467}
.am .pm-btnwrap{padding:8px 16px 24px}
.am .pm-btnwrap .paybtn{width:100%;display:block}


</style>
</head>
<body>
<div class="shell">
  <div class="toolbar" role="toolbar" aria-label="Jump to a path">
    <b>Bonus highlight flow</b>
    <button data-jump="home">Home</button>
    <button data-jump="wallet">Wallet pill</button>
    <button data-jump="listingChat">Listing → Chat</button>
    <button data-jump="again">Chat again (coupon)</button>
    <button data-jump="history">View history (offer)</button>
    <button data-jump="post3">Post 3rd recharge</button>
  </div>

function fit(){
  const vw=window.innerWidth, vh=window.innerHeight;

  // The artifact viewer can lay the page out wider than the phone, which made it show the desktop frame.
  const touch = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const smallScreen = Math.min(screen.width, screen.height) <= 600;
  const forced = new URLSearchParams(location.search).get('view');
  const mobile = forced ? forced === 'mobile' : (vw <= 560 || (touch && smallScreen));
  document.body.classList.toggle('mobile',mobile);
  let s;
  if(mobile){ s=vw/360; H=Math.round(vh/s); }
  else { H=768; s=Math.min(1,(vh-90)/H); }
  phone.style.height=H+'px';

  phone.style.transform=`scale(${s})`;
  stage.style.width=360*s+'px'; stage.style.height=H*s+'px';
}

/* [amount, bonus]. Wallet credit = amount + bonus; GST is 18% of the amount only.

const BASE=[[50,0],[100,150],[250,500],[500,300],[1000,500],[2000,800],[3000,1000],[4000,1200],[5000,1500],[10000,2000]];
let ab={mode:'default',sel:100,banner:false,shown:null,cd:0};
const baseBonusFor=v=>((BASE.find(x=>x[0]===v)||[])[1])||0;
/* ASTRO50 is ITEMISED AT CHECKOUT, not folded into the bonus — her call Sep 21, reversing the

   "Extra bonus" line), and the ₹50 gets its own "Coupon code applied" row in the payment summary.
   It is still credited, so anything showing a wallet TOTAL must read creditFor(), which adds both
   — never v+bonusFor(v), or the coupon silently goes missing from the total. */
const COUPON_FLAT=50;
const bonusFor=v=>baseBonusFor(v);
const couponFor=()=>ab.mode==='coupon'?COUPON_FLAT:0;

// The astrologer's ₹/min, read off the card the user tapped — the price they will actually be
// charged, so the discounted figure when a card strikes one out. null on the wallet chip, where

let flowRate=null;
const LOTTIE_LOW='https://lottie.host/5ddeccf5-8552-43a2-9652-64ffc3b467ac/K2ZA3CwRuI.lottie';
let flowAstro='Astro Hemali';
let flowType='wallet'; // 'insufficient' when the user came from an astrologer's Chat button with too little balance // astrologer the user is trying to reach (null when opened from the wallet)

}

const OFFER_SECONDS=5*60;
function startCountdown(sec){
  if(ticker){clearInterval(ticker);ticker=null}   // openAB starts one; the flows may restart it
  ab.cd=sec;
  // loops rather than stopping at zero — this is a prototype that gets left open
